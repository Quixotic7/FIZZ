<!doctype html>

<!-- FIZZ for iPhone and iPad: mock-ups of the native companion app (the web Manager's look, over USB / Bluetooth MIDI).
     ?shot=<id>   one screen alone at device size, frame included (render_png.py)
     ?sheet=1     every screen in a grid with titles and captions (no query = the sheet)
     &still=1     every animation stopped at a chosen moment (render_png.py passes it) -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FIZZ iOS mock-ups</title>
<style>
@font-face { font-family: "Inter Tight"; src: url("../../site/fonts/InterTight-VF-latin.woff") format("woff"); font-weight: 100 900; }
:root {
  --bg: #000; --panel: #0b0b0e; --raised: #131318; --line: #22222a; --text: #ECECEF; --body: #C9C9D1; --muted: #8D8D96;
  --cyan: #28E1FF; --blue: #3F7DFF; --green: #1FD47E; --cream: #F1F0EA; --orange: #FF6A2C; --pink: #FF3CA0;
  --yellow: #FFD23F; --violet: #9664FF; --magenta: #F03CFF; --champagne: #F3D9A4; --red: #FF6464;
  --k1: #3F7DFF; --k2: #1FD47E; --k3: #F1F0EA; --k4: #FF6A2C; --kalg: #FF8FC8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0d0d10; color: var(--body); font: 500 15px/1.4 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
b { color: var(--text); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; }

/* ================================================================ the devices */
.phone { width: 414px; height: 868px; border-radius: 64px; background: #1a1a1f; padding: 12px; position: relative; flex: none;
  box-shadow: inset 0 0 0 2px #3a3a42, inset 0 0 0 5px #111114, 0 30px 60px rgba(0, 0, 0, .55); }
.phone::before, .phone::after { content: ""; position: absolute; left: -3px; width: 3px; border-radius: 2px 0 0 2px; background: #2c2c33; }
.phone::before { top: 170px; height: 62px; } .phone::after { top: 246px; height: 62px; }
.scr { width: 390px; height: 844px; border-radius: 52px; overflow: hidden; position: relative; background: #000; isolation: isolate; }
.island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 18px; background: #000; z-index: 90; box-shadow: 0 0 0 1px #1c1c22; }
.island::after { content: ""; position: absolute; right: 22px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #2b3550, #07080c 70%); }
.sb { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0 52px; font: 700 17px "Inter Tight"; color: #fff; z-index: 80; pointer-events: none; }
.sb .ic { display: flex; gap: 7px; align-items: center; }
.sb svg { height: 13px; fill: #fff; }
.home { position: absolute; bottom: 8px; left: 50%; width: 134px; margin-left: -67px; height: 5px; border-radius: 3px; background: #fff; z-index: 95; }
.app { position: absolute; inset: 0; padding-top: 54px; }

.ipad { width: 1216px; height: 856px; border-radius: 44px; background: #1a1a1f; padding: 18px; position: relative; flex: none;
  box-shadow: inset 0 0 0 2px #3a3a42, inset 0 0 0 5px #111114, 0 30px 60px rgba(0, 0, 0, .55); }
.ipad .scr { width: 1180px; height: 820px; border-radius: 26px; }
.ipad .cam { position: absolute; top: 6px; left: 50%; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: #07080c; box-shadow: 0 0 0 1px #2a2a30; }
.ipad .sb { height: 30px; padding: 2px 26px 0 30px; font-size: 15px; }
.ipad .app { padding-top: 30px; display: flex; }
.ipad .home { width: 300px; margin-left: -150px; }

/* ================================================================ the app's parts (manager.css, adapted) */
.tb { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; position: relative; z-index: 5; }
.logo { display: flex; align-items: center; gap: 10px; }
.bub { width: 32px; height: 32px; fill: none; stroke-width: 2.4; flex: none; }
.bub circle:nth-child(1) { stroke: var(--cyan); } .bub circle:nth-child(2) { stroke: var(--pink); } .bub circle:nth-child(3) { stroke: var(--yellow); }
.word { font-size: 26px; font-weight: 800; letter-spacing: .06em; background: linear-gradient(90deg, #28E1FF, #3F7DFF 30%, #F03CFF 62%, #FF6A2C 85%, #FFD23F); -webkit-background-clip: text; background-clip: text; color: transparent; }
.unit { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 13px 0 11px; border-radius: 999px; border: 2px solid var(--c, var(--green)); background: color-mix(in srgb, var(--c, var(--green)) 16%, var(--bg)); color: var(--text); font-weight: 800; font-size: 13px; letter-spacing: .02em; white-space: nowrap; margin-left: auto; }
.unit .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--green)); box-shadow: 0 0 8px var(--c, var(--green)); flex: none; }
.livesw { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 5px 0 8px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--pink) 45%, var(--line)); background: color-mix(in srgb, var(--pink) 5%, transparent); color: var(--text); font-weight: 800; font-size: 13px; letter-spacing: .1em; white-space: nowrap; }
.livesw + .unit { margin-left: 0; }
.livesw b { min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; display: grid; place-items: center; background: #24242b; color: var(--text); font-size: 17px; letter-spacing: 0; }
.livesw .sw { width: 32px; height: 20px; border-radius: 10px; background: #24242b; position: relative; flex: none; }
.livesw .sw i { position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); }
.livesw.on { border-color: var(--pink); background: color-mix(in srgb, var(--pink) 14%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--pink) 30%, transparent); }
.livesw.on .sw { background: var(--pink); } .livesw.on .sw i { left: 15px; background: #fff; }
.livesw.on b { background: #fff; color: var(--pink); }
.livesw.hint { animation: hintring 1.6s ease-out infinite; }
@keyframes hintring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pink) 70%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }

/* the floating tab bar */
.nav { position: absolute; left: 12px; right: 12px; bottom: 24px; height: 64px; border-radius: 32px; background: rgba(17, 17, 21, .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid #2a2a33; display: flex; align-items: center; gap: 4px; padding: 0 6px; z-index: 60; box-shadow: 0 12px 34px rgba(0, 0, 0, .8); }
.nv { width: 42px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid color-mix(in srgb, var(--c) 38%, #2a2a33); background: color-mix(in srgb, var(--c) 9%, transparent); flex: none; }
.nv svg { width: 21px; height: 21px; stroke: var(--c); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nv.on { flex: 1; background: var(--c); border-color: var(--c); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 50%, transparent); }
.nv.on svg { stroke: #000; }
.nv.on b { color: #000; font-size: 13px; font-weight: 800; letter-spacing: .05em; }
.nplus { width: 52px; height: 52px; border-radius: 50%; background: var(--violet); display: grid; place-items: center; flex: none; margin-left: 2px; box-shadow: 0 0 20px color-mix(in srgb, var(--violet) 55%, transparent); }
.nplus svg { width: 26px; height: 26px; stroke: #000; stroke-width: 3; fill: none; stroke-linecap: round; }
.fadeb { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(transparent, #000 62%); z-index: 50; pointer-events: none; }

.pg { padding: 4px 16px 0; position: relative; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px; position: relative; display: flex; flex-direction: column; min-width: 0; }
.h { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 10px; }
.h .n { color: var(--text); letter-spacing: 0; font-size: 15px; }
.h .r { margin-left: auto; }
.btn { height: 52px; padding: 0 22px; border-radius: 26px; font-weight: 800; font-size: 16px; letter-spacing: .08em; border: 0; color: #000; background: var(--c, var(--cyan)); display: inline-flex; align-items: center; justify-content: center; gap: 9px; box-shadow: 0 0 22px color-mix(in srgb, var(--c, var(--cyan)) 40%, transparent); white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); box-shadow: none; }
.btn.redline { background: transparent; color: var(--red); border: 1.5px solid color-mix(in srgb, var(--red) 55%, transparent); box-shadow: none; }
.btn.huge { height: 64px; font-size: 19px; border-radius: 32px; }
.btn.small { height: 42px; padding: 0 16px; font-size: 13px; border-radius: 21px; }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon { width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.icon svg { width: 19px; height: 19px; fill: none; stroke: var(--body); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: .05em; color: #000; white-space: nowrap; }
.t-BASS { background: var(--blue); color: #fff; } .t-KEYS { background: var(--cream); } .t-PLUCK { background: var(--yellow); }
.t-PAD { background: var(--violet); color: #fff; } .t-LEAD { background: var(--green); } .t-DRUMS { background: var(--orange); } .t-FX { background: var(--pink); color: #fff; }
.tag.off { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.ptag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; font-size: 12px; font-weight: 800; color: #000; background: var(--green); letter-spacing: .03em; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; }
.seg button { height: 38px; padding: 0 15px; font-weight: 800; font-size: 13px; letter-spacing: .07em; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
.seg button.on { background: var(--c, var(--green)); color: #000; }
@keyframes blink { to { opacity: .15; } }
@keyframes breathe { 50% { box-shadow: 0 0 40px color-mix(in srgb, var(--c) 80%, transparent); transform: scale(1.02); } }

/* the library rows */
.algo { width: 30px; height: 30px; flex: none; }
.cas { height: 56px; border-radius: 12px; background: var(--raised); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; position: relative; margin-bottom: 8px; }
.cas .stripe { position: absolute; left: 0; top: 9px; bottom: 9px; width: 4px; border-radius: 2px; background: var(--c); }
.cas .sl { font-size: 13px; font-weight: 700; color: var(--muted); width: 22px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.cas .nm { color: var(--text); font-weight: 800; font-size: 16px; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cas .mark { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
.cas.sel { border-color: var(--cyan); box-shadow: 0 0 0 2px color-mix(in srgb, var(--cyan) 35%, transparent), 0 0 20px color-mix(in srgb, var(--cyan) 30%, transparent); }
.swr { position: relative; border-radius: 12px; margin-bottom: 8px; }
.swr .cas { margin: 0; z-index: 1; }
.swact { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: .08em; color: #000; border-radius: 12px; }
.swact svg { width: 20px; height: 20px; fill: none; stroke: #000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.swact.lead { left: 0; right: 0; background: var(--green); padding-left: 18px; box-shadow: 0 0 22px color-mix(in srgb, var(--green) 45%, transparent); }
.swr .cas.swR { animation: swR 3.2s cubic-bezier(.45, .05, .35, 1) infinite; }
@keyframes swR { 0%, 12% { transform: none; } 35%, 75% { transform: translateX(132px); } 95%, 100% { transform: none; } }

/* the FM-1, drawn */
.fm1 { fill: none; stroke: var(--c); stroke-width: 2.4; stroke-linecap: round; display: block; overflow: visible; }
.fm1 .body { fill: color-mix(in srgb, var(--c) 6%, #050507); stroke-width: 2.8; }
.fm1 .k { opacity: .75; }
.fm1 .kb { opacity: .55; }
.fm1 .lcd { fill: #000; stroke-width: 3; }
.fm1 .lit { fill: var(--c); opacity: .9; }
.lcdbub circle { stroke-width: 5; fill: none; }

/* bubbles rising (champagne) */
.bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.bb { position: absolute; bottom: -40px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; animation: rise var(--d) linear infinite; animation-delay: var(--dl); }
@keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 8% { opacity: var(--o); } 50% { transform: translate(var(--w), -470px); } 88% { opacity: var(--o); } 100% { transform: translate(0, -940px); opacity: 0; } }

/* ================================================================ 1. connect */
.rig { position: absolute; left: 0; top: 118px; width: 390px; height: 600px; z-index: 2; overflow: visible; }
.rig .cab { fill: none; stroke: #2e2e36; stroke-width: 7; stroke-linecap: round; }
.rig .run { fill: none; stroke: var(--cyan); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 46 560; animation: run 1.8s linear infinite; filter: drop-shadow(0 0 8px var(--cyan)); }
@keyframes run { from { stroke-dashoffset: 606; } to { stroke-dashoffset: 0; } }
.rig .adp { fill: #121217; stroke: var(--cyan); stroke-width: 2.4; }
.rig .adp.glow { animation: glow 1.8s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 10px var(--cyan)); } }
.rig .ph { fill: #050507; stroke: #8d8d96; stroke-width: 2.4; }
.lookrow { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; gap: 14px; z-index: 3; }
.look { height: 60px; padding: 0 28px; border-radius: 30px; border: 2px solid var(--yellow); background: color-mix(in srgb, var(--yellow) 14%, #000); color: var(--text); font-weight: 800; font-size: 16px; letter-spacing: .1em; display: flex; align-items: center; gap: 12px; animation: lookp 1.6s ease-out infinite; }
.look i { width: 12px; height: 12px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 10px var(--yellow); animation: blink .8s infinite alternate; }
@keyframes lookp { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--yellow) 60%, transparent); } 100% { box-shadow: 0 0 0 22px transparent; } }
.bt { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--blue); background: color-mix(in srgb, var(--blue) 14%, #000); display: grid; place-items: center; }
.bt svg { width: 26px; height: 26px; fill: none; stroke: var(--blue); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

.found { position: absolute; left: 20px; right: 20px; top: 150px; text-align: center; border-radius: 30px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 7%, var(--panel)); padding: 34px 20px 30px; display: flex; flex-direction: column; align-items: center; z-index: 2;
  box-shadow: 0 0 50px color-mix(in srgb, var(--c) 30%, transparent); animation: pop .7s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.found .ringw { position: relative; width: 300px; height: 230px; display: grid; place-items: center; }
.found .ring { position: absolute; left: 50%; top: 50%; width: 270px; height: 270px; margin: -135px 0 0 -135px; border-radius: 50%; border: 3px solid var(--c); box-shadow: 0 0 24px color-mix(in srgb, var(--c) 50%, transparent), inset 0 0 24px color-mix(in srgb, var(--c) 30%, transparent); }
.found .ring.rip { animation: rip 2.2s ease-out infinite; box-shadow: none; }
@keyframes rip { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
.found .fm1 { position: relative; }
.found .fz { font-size: 76px; font-weight: 800; letter-spacing: .06em; line-height: 1; margin-top: 22px; }
.found .vv { font-size: 26px; font-weight: 800; color: var(--text); margin-top: 8px; letter-spacing: .01em; }
.found .chip { margin-top: 18px; display: inline-flex; align-items: center; gap: 9px; height: 36px; padding: 0 16px; border-radius: 18px; border: 1.5px solid var(--c); color: var(--c); font-weight: 800; font-size: 14px; letter-spacing: .1em; }
.found .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.found .bigid { font-size: 52px; font-weight: 800; color: var(--c); margin-top: 20px; line-height: 1; animation: shake .6s .5s both; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.found .act { margin-top: 26px; }
.burst { position: absolute; left: 50%; top: 420px; z-index: 3; pointer-events: none; }
.burst i { position: absolute; left: 0; top: 0; border-radius: 50%; border: 2.5px solid var(--bc); animation: burst 2.6s cubic-bezier(.1, .7, .3, 1) infinite; animation-delay: var(--dl); }
@keyframes burst { 0% { transform: translate(-50%, -50%) scale(.2); opacity: 1; } 70% { opacity: .9; } 100% { transform: translate(calc(var(--x) - 50%), calc(var(--y) - 50%)) scale(1); opacity: 0; } }
.upd .fm1 .arr { animation: drop 1.4s ease-in infinite; }
@keyframes drop { 0% { transform: translateY(-26px); opacity: 0; } 30% { opacity: 1; } 80% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
.bad .fm1 { animation: flick 2.4s steps(1) infinite; }
@keyframes flick { 0%, 100% { opacity: 1; } 62% { opacity: .35; } 66% { opacity: 1; } 70% { opacity: .5; } 74% { opacity: 1; } }
.two { position: absolute; left: 16px; right: 16px; top: 130px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 2; }
.two .uc { height: 470px; border-radius: 26px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 8%, var(--panel)); display: flex; flex-direction: column; align-items: center; padding: 26px 10px 22px; gap: 14px; box-shadow: 0 0 34px color-mix(in srgb, var(--c) 28%, transparent); animation: float 3.6s ease-in-out infinite; }
.two .uc:nth-child(2) { animation-delay: -1.8s; }
@keyframes float { 50% { transform: translateY(-8px); } }
.two .uc .pn { font-size: 21px; font-weight: 800; color: var(--text); text-align: center; line-height: 1.1; margin-top: 8px; }
.two .uc .pn small { display: block; color: var(--c); font-size: 15px; letter-spacing: .06em; margin-top: 8px; }
.two .uc .tapc { margin-top: auto; width: 74px; height: 74px; border-radius: 50%; background: var(--c); display: grid; place-items: center; box-shadow: 0 0 26px color-mix(in srgb, var(--c) 55%, transparent); }
.two .uc .tapc svg { width: 32px; height: 32px; fill: none; stroke: #000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.two .uc .ldot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.twoh { position: absolute; left: 0; right: 0; top: 124px; text-align: center; z-index: 2; }

/* ================================================================ BACKUP */
.this { gap: 16px; }
.vrow { display: flex; align-items: baseline; gap: 10px; }
.vbig { font-size: 50px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: -.01em; }
.vb { font-size: 15px; font-weight: 800; color: #000; background: var(--yellow); border-radius: 8px; padding: 3px 9px; align-self: center; letter-spacing: .04em; }
.stats { display: flex; gap: 26px; }
.kv { font-size: 13px; font-weight: 700; color: var(--muted); }
.kv b { font-size: 32px; font-weight: 800; display: block; line-height: 1.1; }
.kv b small { font-size: 20px; }
.meter { height: 26px; border-radius: 13px; background: #15151a; display: flex; overflow: hidden; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; transform-origin: left; animation: grow 1.2s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes grow { from { transform: scaleX(0); } }
.legend { display: flex; gap: 16px; margin-top: 9px; font-size: 13px; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .r { margin-left: auto; color: var(--text); }
.actions { display: flex; gap: 10px; }
.bk { display: flex; align-items: center; gap: 12px; height: 70px; padding: 0 12px; border-radius: 16px; background: var(--raised); border: 1.5px solid var(--line); --c: var(--yellow); position: relative; z-index: 1; }
.bk .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); border: 1.5px solid var(--c); flex: none; }
.bk .ic svg { width: 24px; height: 24px; fill: none; stroke: var(--c); stroke-width: 2.2; }
.bk .txt { min-width: 0; flex: 1; }
.bk .when { color: var(--text); font-weight: 800; font-size: 18px; white-space: nowrap; }
.bk .what { display: flex; gap: 11px; font-size: 14px; font-weight: 800; color: var(--text); align-items: center; margin-top: 2px; }

// ---------------------------------------------------------------- the operator diagram (site/manager/editor.js algoSvg)
const ALGOS = [[[6, 0, 8, 0], 1, 1, 4], [[2, 0, 8, 0], 3, 1, 4], [[2, 0, 2, 2], 1, 9, 4], [[2, 4, 8, 0], 3, 1, 4], [[2, 12, 0, 0], 2, 1, 2], [[10, 0, 10, 0], 1, 1, 4], [[2, 0, 8, 0], 1, 3, 12], [[2, 0, 0, 0], 2, 9, 4]];
const OPS = [["C", "--k1"], ["A", "--k2"], ["B1", "--k3"], ["B2", "--k4"]];
function algoSvg(al, hot = -1, vb = "0 10 600 390", ax = 0) {
  const [mods, fb, ox, oy] = ALGOS[al - 1], out = ox | oy, dep = [0, 0, 0, 0];
  for (let it = 0; it < 4; it++) for (let t = 0; t < 4; t++) for (let o = 0; o < 4; o++) if (o !== t && ((mods[t] >> o) & 1) && dep[o] < dep[t] + 1) dep[o] = dep[t] + 1;
  const n = [0, 0, 0, 0], row = [0, 0, 0, 0]; let md = 0;
  for (let o = 0; o < 4; o++) { row[o] = n[Math.min(3, dep[o])]++; md = Math.max(md, dep[o]); }
  const sp = md >= 3 ? 82 : md === 2 ? 108 : 124, R = 40, BUS = 372, x = [], y = [];
  for (let o = 0; o < 4; o++) { const d = Math.min(3, dep[o]), cnt = n[d]; x[o] = 340 + (row[o] - (cnt - 1) / 2) * 130 + (md >= 3 && cnt === 1 ? (d % 2 ? 34 : -34) : 0); y[o] = BUS - 66 - d * sp; }
  const sx = 20 / 127 + 0.5, sy = 1 - sx;
  const parts = [`<line x1="150" y1="${BUS}" x2="520" y2="${BUS}" class="bus"/>`, `<path d="M528 ${BUS - 12}h12v24h-12zM540 ${BUS - 12}l16-14v52l-16-14" class="spk"/><path d="M566 ${BUS - 16}a22 22 0 0 1 0 32" class="spk wave"/>`];
  for (let o = 0; o < 4; o++) if ((out >> o) & 1) {
    const sh = (ox >> o) & 1 && (oy >> o) & 1 ? 1 : (ox >> o) & 1 ? sx : sy, lw = 2 + 6 * sh, cx = dep[o] ? x[o] + R + 10 : x[o];
    if (dep[o]) parts.push(`<path d="M${x[o] + R} ${y[o]} H${cx} V${BUS}" class="carrier" style="stroke-width:${lw.toFixed(1)};opacity:${(0.35 + 0.65 * sh).toFixed(2)}"/>`);
    else parts.push(`<line x1="${cx}" y1="${y[o] + R}" x2="${cx}" y2="${BUS}" class="carrier" style="stroke-width:${lw.toFixed(1)};opacity:${(0.35 + 0.65 * sh).toFixed(2)}"/>`);
    parts.push(`<circle cx="${cx}" cy="${BUS}" r="${(3 + 2 * sh).toFixed(1)}" class="joint"/>`);
  }
  for (let t = 0; t < 4; t++) for (let o = 0; o < 4; o++) if (o !== t && ((mods[t] >> o) & 1)) {
    const dx = x[t] - x[o], dy = y[t] - y[o], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l;
    const sx0 = x[o] + ux * (R + 2), sy0 = y[o] + uy * (R + 2), ex = x[t] - ux * (R + 6), ey = y[t] - uy * (R + 6);
    parts.push(`<line x1="${sx0.toFixed(1)}" y1="${sy0.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" class="modl"/>` +
      `<path d="M${ex.toFixed(1)} ${ey.toFixed(1)} l${(-ux * 14 - uy * 8).toFixed(1)} ${(-uy * 14 + ux * 8).toFixed(1)} l${(uy * 16).toFixed(1)} ${(-ux * 16).toFixed(1)} z" class="arrow"/>` +
      `<circle r="6" class="spark"><animateMotion dur="${(1.1 + 0.15 * (o + t)).toFixed(2)}s" repeatCount="indefinite" path="M${sx0.toFixed(1)} ${sy0.toFixed(1)} L${ex.toFixed(1)} ${ey.toFixed(1)}"/></circle>`);
  }
  if (fb < 4) parts.push(`<path d="M${x[fb] + R * 0.7} ${y[fb] - R * 0.7} a28 28 0 1 1 ${R * 0.5} ${R * 0.95}" class="fb" style="stroke:var(${OPS[fb][1]})"/>`);
  OPS.forEach(([nm, c], o) => parts.push(`<g class="op ${hot === o ? "on" : ""}" style="--c:var(${c})"><circle cx="${x[o]}" cy="${y[o]}" r="${R}"/><text x="${x[o]}" y="${y[o] + 11}" text-anchor="middle">${nm}</text></g>`));
  parts.push(`<text x="${14 + ax}" y="${ax ? 92 : 62}" class="algolab">ALGO</text><text x="${6 + ax}" y="${ax ? 226 : 196}" class="algonum">${al}</text>`);
  return `<svg class="algosvg" viewBox="${vb}">${parts.join("")}</svg>`;
}

function burst(c) {
  const r = rnd(21); let s = "";
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * 2 * Math.PI + r() * 0.3, d = 200 + r() * 120, sz = 8 + r() * 22, cols = [c, "var(--champagne)", "var(--cyan)", "var(--pink)", "var(--yellow)"];
    s += `<i style="width:${sz.toFixed(0)}px;height:${sz.toFixed(0)}px;--x:${(Math.cos(a) * d).toFixed(0)}px;--y:${(Math.sin(a) * d).toFixed(0)}px;--bc:${cols[i % 5]};--dl:-${(r() * 2.6).toFixed(2)}s"></i>`;
  }
  return `<div class="burst">${s}</div>`;
}

// ---------------------------------------------------------------- the page
const out = document.getElementById("out");
const inits = [];
if (SHOT) {
  document.body.className = "shot";
  const s = SCREENS.find((x) => x.id === SHOT) || SCREENS[0];
  const el = $h(`<div>${s.html()}</div>`); out.appendChild(el); if (s.init) inits.push([s, el]);
} else {
  document.body.className = "sheet";
  out.appendChild($h(`<div class="sheettitle">FIZZ for iPhone and iPad: the companion app (mock-up)</div>`));
  out.appendChild($h(`<div class="sheetsub">The web Manager's tabs over USB (Camera / USB adapter) or Bluetooth MIDI. Captions describe the motion; they are not on screen.</div>`));
  const g = $h(`<div class="sgridp"></div>`); out.appendChild(g);
  SCREENS.forEach((s, i) => {
    const el = $h(`<div class="cell ${s.ipad ? "wide" : ""}"><div class="zf">${s.html()}</div><div class="ct"><span>${String(i + 1).padStart(2, "0")}</span>${s.id} · ${s.title}</div><p class="cap">${s.cap}</p></div>`);
    g.appendChild(el); if (s.init) inits.push([s, el]);
  });
}
inits.forEach(([s, el]) => s.init(el));
// still: every animation stopped at a chosen moment (a fraction of its loop), one-shots finished; SMIL at 0.6 s
const POSTER = { swR: 0.5, swL: 0.5, slideK: 0.3, slideF: 0.3, burst: 0.5, rip: 0.35, fing: 0.5, trail: 0.5, tpop: 0.12, tbub: 0.16, lookp: 0.8, hintring: 0.62, drop: 0.55, flick: 0.1, run: 0.42, lv: 0.6, breathe: 0.5, curglow: 0.5, ppulse: 0.5 };
function freeze() {
  document.getAnimations().forEach((a) => {
    const t = a.effect.getTiming();
    if (t.iterations === Infinity) { a.currentTime = (POSTER[a.animationName] ?? 0.5) * t.duration; a.pause(); } else a.finish();
  });
  document.querySelectorAll("svg").forEach((s) => { if (s.pauseAnimations && !s.ownerSVGElement) { s.pauseAnimations(); s.setCurrentTime(0.6); } });
}
if (STILL) document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(freeze)));
</script>
