<!doctype html>

<!-- FIZZ for iPhone and iPad: mock-ups of the native companion app (the web Manager's look, over USB / Bluetooth MIDI).
     ?shot=<id>   one screen alone at device size, frame included (render_png.py)
     ?sheet=1     every screen in a grid with titles and captions (no query = the sheet)
     &still=1     every animation stopped at a chosen moment (render_png.py passes it) -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FIZZ iOS mock-ups</title>
<style>
@font-face { font-family: "Inter Tight"; src: url("../../site/fonts/InterTight-VF-latin.woff") format("woff"); font-weight: 100 900; }
:root {
  --bg: #000; --panel: #0b0b0e; --raised: #131318; --line: #22222a; --text: #ECECEF; --body: #C9C9D1; --muted: #8D8D96;
  --cyan: #28E1FF; --blue: #3F7DFF; --green: #1FD47E; --cream: #F1F0EA; --orange: #FF6A2C; --pink: #FF3CA0;
  --yellow: #FFD23F; --violet: #9664FF; --magenta: #F03CFF; --champagne: #F3D9A4; --red: #FF6464;
  --k1: #3F7DFF; --k2: #1FD47E; --k3: #F1F0EA; --k4: #FF6A2C; --kalg: #FF8FC8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0d0d10; color: var(--body); font: 500 15px/1.4 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
b { color: var(--text); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; }

/* ================================================================ the devices */
.phone { width: 414px; height: 868px; border-radius: 64px; background: #1a1a1f; padding: 12px; position: relative; flex: none;
  box-shadow: inset 0 0 0 2px #3a3a42, inset 0 0 0 5px #111114, 0 30px 60px rgba(0, 0, 0, .55); }
.phone::before, .phone::after { content: ""; position: absolute; left: -3px; width: 3px; border-radius: 2px 0 0 2px; background: #2c2c33; }
.phone::before { top: 170px; height: 62px; } .phone::after { top: 246px; height: 62px; }
.scr { width: 390px; height: 844px; border-radius: 52px; overflow: hidden; position: relative; background: #000; isolation: isolate; }
.island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 18px; background: #000; z-index: 90; box-shadow: 0 0 0 1px #1c1c22; }
.island::after { content: ""; position: absolute; right: 22px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #2b3550, #07080c 70%); }
.sb { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0 52px; font: 700 17px "Inter Tight"; color: #fff; z-index: 80; pointer-events: none; }
.sb .ic { display: flex; gap: 7px; align-items: center; }
.sb svg { height: 13px; fill: #fff; }
.home { position: absolute; bottom: 8px; left: 50%; width: 134px; margin-left: -67px; height: 5px; border-radius: 3px; background: #fff; z-index: 95; }
.app { position: absolute; inset: 0; padding-top: 54px; }

.ipad { width: 1216px; height: 856px; border-radius: 44px; background: #1a1a1f; padding: 18px; position: relative; flex: none;
  box-shadow: inset 0 0 0 2px #3a3a42, inset 0 0 0 5px #111114, 0 30px 60px rgba(0, 0, 0, .55); }
.ipad .scr { width: 1180px; height: 820px; border-radius: 26px; }
.ipad .cam { position: absolute; top: 6px; left: 50%; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: #07080c; box-shadow: 0 0 0 1px #2a2a30; }
.ipad .sb { height: 30px; padding: 2px 26px 0 30px; font-size: 15px; }
.ipad .app { padding-top: 30px; display: flex; }
.ipad .home { width: 300px; margin-left: -150px; }

/* ================================================================ the app's parts (manager.css, adapted) */
.tb { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; position: relative; z-index: 5; }
.logo { display: flex; align-items: center; gap: 10px; }
.bub { width: 32px; height: 32px; fill: none; stroke-width: 2.4; flex: none; }
.bub circle:nth-child(1) { stroke: var(--cyan); } .bub circle:nth-child(2) { stroke: var(--pink); } .bub circle:nth-child(3) { stroke: var(--yellow); }
.word { font-size: 26px; font-weight: 800; letter-spacing: .06em; background: linear-gradient(90deg, #28E1FF, #3F7DFF 30%, #F03CFF 62%, #FF6A2C 85%, #FFD23F); -webkit-background-clip: text; background-clip: text; color: transparent; }
.unit { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 13px 0 11px; border-radius: 999px; border: 2px solid var(--c, var(--green)); background: color-mix(in srgb, var(--c, var(--green)) 16%, var(--bg)); color: var(--text); font-weight: 800; font-size: 13px; letter-spacing: .02em; white-space: nowrap; margin-left: auto; }
.unit .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--green)); box-shadow: 0 0 8px var(--c, var(--green)); flex: none; }
.livesw { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 5px 0 8px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--pink) 45%, var(--line)); background: color-mix(in srgb, var(--pink) 5%, transparent); color: var(--text); font-weight: 800; font-size: 13px; letter-spacing: .1em; white-space: nowrap; }
.livesw + .unit { margin-left: 0; }
.livesw b { min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; display: grid; place-items: center; background: #24242b; color: var(--text); font-size: 17px; letter-spacing: 0; }
.livesw .sw { width: 32px; height: 20px; border-radius: 10px; background: #24242b; position: relative; flex: none; }
.livesw .sw i { position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); }
.livesw.on { border-color: var(--pink); background: color-mix(in srgb, var(--pink) 14%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--pink) 30%, transparent); }
.livesw.on .sw { background: var(--pink); } .livesw.on .sw i { left: 15px; background: #fff; }
.livesw.on b { background: #fff; color: var(--pink); }
.livesw.hint { animation: hintring 1.6s ease-out infinite; }
@keyframes hintring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pink) 70%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }

/* the floating tab bar */
.nav { position: absolute; left: 12px; right: 12px; bottom: 24px; height: 64px; border-radius: 32px; background: rgba(17, 17, 21, .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid #2a2a33; display: flex; align-items: center; gap: 4px; padding: 0 6px; z-index: 60; box-shadow: 0 12px 34px rgba(0, 0, 0, .8); }
.nv { width: 42px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid color-mix(in srgb, var(--c) 38%, #2a2a33); background: color-mix(in srgb, var(--c) 9%, transparent); flex: none; }
.nv svg { width: 21px; height: 21px; stroke: var(--c); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nv.on { flex: 1; background: var(--c); border-color: var(--c); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 50%, transparent); }
.nv.on svg { stroke: #000; }
.nv.on b { color: #000; font-size: 13px; font-weight: 800; letter-spacing: .05em; }
.nplus { width: 52px; height: 52px; border-radius: 50%; background: var(--violet); display: grid; place-items: center; flex: none; margin-left: 2px; box-shadow: 0 0 20px color-mix(in srgb, var(--violet) 55%, transparent); }
.nplus svg { width: 26px; height: 26px; stroke: #000; stroke-width: 3; fill: none; stroke-linecap: round; }
.fadeb { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(transparent, #000 62%); z-index: 50; pointer-events: none; }

.pg { padding: 4px 16px 0; position: relative; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px; position: relative; display: flex; flex-direction: column; min-width: 0; }
.h { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 10px; }
.h .n { color: var(--text); letter-spacing: 0; font-size: 15px; }
.h .r { margin-left: auto; }
.btn { height: 52px; padding: 0 22px; border-radius: 26px; font-weight: 800; font-size: 16px; letter-spacing: .08em; border: 0; color: #000; background: var(--c, var(--cyan)); display: inline-flex; align-items: center; justify-content: center; gap: 9px; box-shadow: 0 0 22px color-mix(in srgb, var(--c, var(--cyan)) 40%, transparent); white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); box-shadow: none; }
.btn.redline { background: transparent; color: var(--red); border: 1.5px solid color-mix(in srgb, var(--red) 55%, transparent); box-shadow: none; }
.btn.huge { height: 64px; font-size: 19px; border-radius: 32px; }
.btn.small { height: 42px; padding: 0 16px; font-size: 13px; border-radius: 21px; }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon { width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.icon svg { width: 19px; height: 19px; fill: none; stroke: var(--body); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: .05em; color: #000; white-space: nowrap; }
.t-BASS { background: var(--blue); color: #fff; } .t-KEYS { background: var(--cream); } .t-PLUCK { background: var(--yellow); }
.t-PAD { background: var(--violet); color: #fff; } .t-LEAD { background: var(--green); } .t-DRUMS { background: var(--orange); } .t-FX { background: var(--pink); color: #fff; }
.tag.off { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.ptag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; font-size: 12px; font-weight: 800; color: #000; background: var(--green); letter-spacing: .03em; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; }
.seg button { height: 38px; padding: 0 15px; font-weight: 800; font-size: 13px; letter-spacing: .07em; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
.seg button.on { background: var(--c, var(--green)); color: #000; }
@keyframes blink { to { opacity: .15; } }
@keyframes breathe { 50% { box-shadow: 0 0 40px color-mix(in srgb, var(--c) 80%, transparent); transform: scale(1.02); } }

/* the library rows */
.algo { width: 30px; height: 30px; flex: none; }
.cas { height: 56px; border-radius: 12px; background: var(--raised); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; position: relative; margin-bottom: 8px; }
.cas .stripe { position: absolute; left: 0; top: 9px; bottom: 9px; width: 4px; border-radius: 2px; background: var(--c); }
.cas .sl { font-size: 13px; font-weight: 700; color: var(--muted); width: 22px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.cas .nm { color: var(--text); font-weight: 800; font-size: 16px; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cas .mark { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
.cas.sel { border-color: var(--cyan); box-shadow: 0 0 0 2px color-mix(in srgb, var(--cyan) 35%, transparent), 0 0 20px color-mix(in srgb, var(--cyan) 30%, transparent); }
.swr { position: relative; border-radius: 12px; margin-bottom: 8px; }
.swr .cas { margin: 0; z-index: 1; }
.swact { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: .08em; color: #000; border-radius: 12px; }
.swact svg { width: 20px; height: 20px; fill: none; stroke: #000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.swact.lead { left: 0; right: 0; background: var(--green); padding-left: 18px; box-shadow: 0 0 22px color-mix(in srgb, var(--green) 45%, transparent); }
.swr .cas.swR { animation: swR 3.2s cubic-bezier(.45, .05, .35, 1) infinite; }
@keyframes swR { 0%, 12% { transform: none; } 35%, 75% { transform: translateX(132px); } 95%, 100% { transform: none; } }

/* the FM-1, drawn */
.fm1 { fill: none; stroke: var(--c); stroke-width: 2.4; stroke-linecap: round; display: block; overflow: visible; }
.fm1 .body { fill: color-mix(in srgb, var(--c) 6%, #050507); stroke-width: 2.8; }
.fm1 .k { opacity: .75; }
.fm1 .kb { opacity: .55; }
.fm1 .lcd { fill: #000; stroke-width: 3; }
.fm1 .lit { fill: var(--c); opacity: .9; }
.lcdbub circle { stroke-width: 5; fill: none; }

/* bubbles rising (champagne) */
.bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.bb { position: absolute; bottom: -40px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; animation: rise var(--d) linear infinite; animation-delay: var(--dl); }
@keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 8% { opacity: var(--o); } 50% { transform: translate(var(--w), -470px); } 88% { opacity: var(--o); } 100% { transform: translate(0, -940px); opacity: 0; } }

/* ================================================================ 1. connect */
.rig { position: absolute; left: 0; top: 118px; width: 390px; height: 600px; z-index: 2; overflow: visible; }
.rig .cab { fill: none; stroke: #2e2e36; stroke-width: 7; stroke-linecap: round; }
.rig .run { fill: none; stroke: var(--cyan); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 46 560; animation: run 1.8s linear infinite; filter: drop-shadow(0 0 8px var(--cyan)); }
@keyframes run { from { stroke-dashoffset: 606; } to { stroke-dashoffset: 0; } }
.rig .adp { fill: #121217; stroke: var(--cyan); stroke-width: 2.4; }
.rig .adp.glow { animation: glow 1.8s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 10px var(--cyan)); } }
.rig .ph { fill: #050507; stroke: #8d8d96; stroke-width: 2.4; }
.lookrow { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; gap: 14px; z-index: 3; }
.look { height: 60px; padding: 0 28px; border-radius: 30px; border: 2px solid var(--yellow); background: color-mix(in srgb, var(--yellow) 14%, #000); color: var(--text); font-weight: 800; font-size: 16px; letter-spacing: .1em; display: flex; align-items: center; gap: 12px; animation: lookp 1.6s ease-out infinite; }
.look i { width: 12px; height: 12px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 10px var(--yellow); animation: blink .8s infinite alternate; }
@keyframes lookp { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--yellow) 60%, transparent); } 100% { box-shadow: 0 0 0 22px transparent; } }
.bt { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--blue); background: color-mix(in srgb, var(--blue) 14%, #000); display: grid; place-items: center; }
.bt svg { width: 26px; height: 26px; fill: none; stroke: var(--blue); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

.found { position: absolute; left: 20px; right: 20px; top: 150px; text-align: center; border-radius: 30px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 7%, var(--panel)); padding: 34px 20px 30px; display: flex; flex-direction: column; align-items: center; z-index: 2;
  box-shadow: 0 0 50px color-mix(in srgb, var(--c) 30%, transparent); animation: pop .7s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.found .ringw { position: relative; width: 300px; height: 230px; display: grid; place-items: center; }
.found .ring { position: absolute; left: 50%; top: 50%; width: 270px; height: 270px; margin: -135px 0 0 -135px; border-radius: 50%; border: 3px solid var(--c); box-shadow: 0 0 24px color-mix(in srgb, var(--c) 50%, transparent), inset 0 0 24px color-mix(in srgb, var(--c) 30%, transparent); }
.found .ring.rip { animation: rip 2.2s ease-out infinite; box-shadow: none; }
@keyframes rip { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
.found .fm1 { position: relative; }
.found .fz { font-size: 76px; font-weight: 800; letter-spacing: .06em; line-height: 1; margin-top: 22px; }
.found .vv { font-size: 26px; font-weight: 800; color: var(--text); margin-top: 8px; letter-spacing: .01em; }
.found .chip { margin-top: 18px; display: inline-flex; align-items: center; gap: 9px; height: 36px; padding: 0 16px; border-radius: 18px; border: 1.5px solid var(--c); color: var(--c); font-weight: 800; font-size: 14px; letter-spacing: .1em; }
.found .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.found .bigid { font-size: 52px; font-weight: 800; color: var(--c); margin-top: 20px; line-height: 1; animation: shake .6s .5s both; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.found .act { margin-top: 26px; }
.burst { position: absolute; left: 50%; top: 420px; z-index: 3; pointer-events: none; }
.burst i { position: absolute; left: 0; top: 0; border-radius: 50%; border: 2.5px solid var(--bc); animation: burst 2.6s cubic-bezier(.1, .7, .3, 1) infinite; animation-delay: var(--dl); }
@keyframes burst { 0% { transform: translate(-50%, -50%) scale(.2); opacity: 1; } 70% { opacity: .9; } 100% { transform: translate(calc(var(--x) - 50%), calc(var(--y) - 50%)) scale(1); opacity: 0; } }
.upd .fm1 .arr { animation: drop 1.4s ease-in infinite; }
@keyframes drop { 0% { transform: translateY(-26px); opacity: 0; } 30% { opacity: 1; } 80% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
.bad .fm1 { animation: flick 2.4s steps(1) infinite; }
@keyframes flick { 0%, 100% { opacity: 1; } 62% { opacity: .35; } 66% { opacity: 1; } 70% { opacity: .5; } 74% { opacity: 1; } }
.two { position: absolute; left: 16px; right: 16px; top: 130px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 2; }
.two .uc { height: 470px; border-radius: 26px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 8%, var(--panel)); display: flex; flex-direction: column; align-items: center; padding: 26px 10px 22px; gap: 14px; box-shadow: 0 0 34px color-mix(in srgb, var(--c) 28%, transparent); animation: float 3.6s ease-in-out infinite; }
.two .uc:nth-child(2) { animation-delay: -1.8s; }
@keyframes float { 50% { transform: translateY(-8px); } }
.two .uc .pn { font-size: 21px; font-weight: 800; color: var(--text); text-align: center; line-height: 1.1; margin-top: 8px; }
.two .uc .pn small { display: block; color: var(--c); font-size: 15px; letter-spacing: .06em; margin-top: 8px; }
.two .uc .tapc { margin-top: auto; width: 74px; height: 74px; border-radius: 50%; background: var(--c); display: grid; place-items: center; box-shadow: 0 0 26px color-mix(in srgb, var(--c) 55%, transparent); }
.two .uc .tapc svg { width: 32px; height: 32px; fill: none; stroke: #000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.two .uc .ldot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.twoh { position: absolute; left: 0; right: 0; top: 124px; text-align: center; z-index: 2; }

/* ================================================================ BACKUP */
.this { gap: 16px; }
.vrow { display: flex; align-items: baseline; gap: 10px; }
.vbig { font-size: 50px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: -.01em; }
.vb { font-size: 15px; font-weight: 800; color: #000; background: var(--yellow); border-radius: 8px; padding: 3px 9px; align-self: center; letter-spacing: .04em; }
.stats { display: flex; gap: 26px; }
.kv { font-size: 13px; font-weight: 700; color: var(--muted); }
.kv b { font-size: 32px; font-weight: 800; display: block; line-height: 1.1; }
.kv b small { font-size: 20px; }
.meter { height: 26px; border-radius: 13px; background: #15151a; display: flex; overflow: hidden; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; transform-origin: left; animation: grow 1.2s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes grow { from { transform: scaleX(0); } }
.legend { display: flex; gap: 16px; margin-top: 9px; font-size: 13px; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .r { margin-left: auto; color: var(--text); }
.actions { display: flex; gap: 10px; }
.bk { display: flex; align-items: center; gap: 12px; height: 70px; padding: 0 12px; border-radius: 16px; background: var(--raised); border: 1.5px solid var(--line); --c: var(--yellow); position: relative; z-index: 1; }
.bk .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); border: 1.5px solid var(--c); flex: none; }
.bk .ic svg { width: 24px; height: 24px; fill: none; stroke: var(--c); stroke-width: 2.2; }
.bk .txt { min-width: 0; flex: 1; }
.bk .when { color: var(--text); font-weight: 800; font-size: 18px; white-space: nowrap; }
.bk .what { display: flex; gap: 11px; font-size: 14px; font-weight: 800; color: var(--text); align-items: center; margin-top: 2px; }

.cas .ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #3a3a44; flex: none; display: grid; place-items: center; }

.cas.pk { border-color: var(--champagne); background: color-mix(in srgb, var(--champagne) 9%, var(--raised)); box-shadow: 0 0 16px color-mix(in srgb, var(--champagne) 22%, transparent); }
.cas.pk .ck { background: var(--champagne); border-color: var(--champagne); box-shadow: 0 0 10px color-mix(in srgb, var(--champagne) 60%, transparent); }
.cas.pk .ck svg { opacity: 1; }
.cas.pk.last .ck { animation: ckpop 2.4s ease-out infinite; }
@keyframes ckpop { 0% { transform: scale(.5); } 14% { transform: scale(1.25); } 28%, 100% { transform: none; } }
/* the targets: one tap sends */
.tgts { display: grid; grid-template-columns: 1.45fr 1fr 1.1fr; gap: 7px; margin-top: 10px; }
.stg { height: 54px; border-radius: 16px; border: 2px solid color-mix(in srgb, var(--violet) 55%, var(--line)); background: color-mix(in srgb, var(--violet) 8%, transparent); display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 800; font-size: 14px; letter-spacing: .05em; color: var(--text); white-space: nowrap; }
.stg i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.stg .tn { width: 24px; height: 24px; border-radius: 12px; background: var(--pink); color: #fff; display: grid; place-items: center; font-size: 14px; font-style: normal; }
.stg.fly { animation: tgtfly 2.6s ease-out infinite; }
@keyframes tgtfly { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--violet) 0%, transparent); } 20% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--violet) 70%, transparent); } 60% { box-shadow: 0 0 0 14px transparent; } }
/* the selection's bar (above the tab bar) */

.selbar .top .btn { height: 40px; font-size: 13px; padding: 0 14px; }
.selbar .icon.red { border-color: color-mix(in srgb, var(--red) 55%, transparent); } .selbar .icon.red svg { stroke: var(--red); }

.edacts .btn svg.phg { width: 17px; height: 17px; }
/* no FM-1: the drawing */
.nofm { position: relative; height: 330px; margin: 0 -16px; }

.nofm .cab { fill: none; stroke: #2e2e36; stroke-width: 7; stroke-linecap: round; }
.nofm .plugA { animation: plugA 2.8s ease-in-out infinite; }
.nofm .plugB { animation: plugB 2.8s ease-in-out infinite; }
@keyframes plugA { 0%, 100% { transform: translateY(-10px); } 50% { transform: translateY(4px); } }
@keyframes plugB { 0%, 100% { transform: translateY(10px); } 50% { transform: translateY(-4px); } }
.nofm .gap { stroke: var(--yellow); stroke-width: 3; stroke-linecap: round; animation: blink .7s infinite alternate; filter: drop-shadow(0 0 6px var(--yellow)); }

/* iPad: the FM-1 and the phone side by side */
.cols .fmc { width: 322px; flex: none; }

.cols .phc { width: 290px; flex: none; border-color: color-mix(in srgb, var(--champagne) 45%, var(--line)); background: color-mix(in srgb, var(--champagne) 3%, var(--panel)); }
.cols .fmc .seg { --c: var(--cream); display: flex; margin-bottom: 12px; }

.phc .h { color: var(--champagne); }

.det .tgts { grid-template-columns: 1fr 1fr; }
.det .tgts .stg:first-child { grid-column: span 2; }
.ghost-row { position: absolute; z-index: 30; width: 250px; pointer-events: none; animation: dragL 3.2s cubic-bezier(.45, .05, .35, 1) infinite; }
.ghost-row .cas { margin: 0; transform: rotate(-3deg); border-color: var(--champagne); box-shadow: 0 16px 30px #000, 0 0 24px color-mix(in srgb, var(--champagne) 45%, transparent); background: color-mix(in srgb, var(--champagne) 10%, var(--raised)); }
.still .ghost-row { animation: none; }
@keyframes dragL { 0%, 10% { transform: translate(330px, 0); opacity: 0; } 18% { opacity: 1; } 55%, 72% { transform: none; opacity: 1; } 88%, 100% { transform: none; opacity: 0; } }
.dropline { height: 4px; border-radius: 2px; background: var(--champagne); box-shadow: 0 0 12px var(--champagne); margin: -4px 4px 4px; animation: blink .6s infinite alternate; }

/* ================================================================ the emulator: FIZZ on the phone (29–33; 23–28 updated) */
/* the panel follows the owner's RemoteFM1 iOS design (RemoteFM1IOS/design/canvas: Main, PhoneSheet, PhoneKeys,
   PhoneWide, PadWide; the parts Knob, Buttons, Keys, Screen); the theme is a set of custom properties on .emu */
@font-face { font-family: "Chakra Petch"; src: url("fonts/ChakraPetch-Bold.ttf") format("truetype"); font-weight: 700; }
:root { --emu: #FF8A4C; }
.emul { position: absolute; inset: 0; background: var(--t-body); overflow: hidden; }
.scr.emus .sb { color: var(--t-label); } .scr.emus .sb svg { fill: var(--t-label); }
.scr.emus .home { background: var(--t-label); opacity: .7; }
.scr.emus.sbl .sb { color: #F3EBDC; } .scr.emus.sbl .sb svg { fill: #F3EBDC; }
.esheet .mm small.ecnt i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; } .esheet .mm small.ecnt b { margin-right: 14px; font-size: 16px; }
.ekgrid.tight .ekn > span { letter-spacing: .02em; }
.emul .hdr { position: absolute; left: 16px; right: 16px; top: 50px; height: 36px; display: flex; align-items: center; justify-content: space-between; }
.emul .me { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px 0 10px; border-radius: 999px; background: rgba(0, 0, 0, .14); color: var(--t-label); font: 800 13px "Inter Tight"; letter-spacing: .06em; white-space: nowrap; }
.emul .me .phg { width: 13px; height: 15px; }
.emul .me i { width: 8px; height: 8px; border-radius: 50%; background: var(--t-label); }
.emul .me.lnk i { background: #3BD47A; box-shadow: 0 0 8px #3BD47A; }
.emul .egrab { position: absolute; left: 50%; top: -4px; width: 88px; height: 44px; margin-left: -44px; display: flex; align-items: center; justify-content: center; }
.emul .egrab span { width: 40px; height: 5px; border-radius: 3px; background: var(--t-label); opacity: .55; }
.emul .efz { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px 0 6px; border-radius: 999px; background: #0b0b0e; box-shadow: 0 3px 0 rgba(0, 0, 0, .22); }
.emul .efz .bub { width: 26px; height: 26px; }
.emul .efz .word { font-size: 17px; }
.abs { position: absolute; }
/* a knob (Knob.dc): label above, the dark cap with its knurled ring, a mark in FIZZ's knob colour */
.ekn { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
.ekn > span { font: 700 12px/1 "Chakra Petch"; letter-spacing: .07em; color: var(--t-label); white-space: nowrap; text-transform: uppercase; }
.ekn .cap { border-radius: 50%; box-shadow: 0 var(--sh) 0 rgba(0, 0, 0, .28); display: block; }
.ekn .cap svg { display: block; }
.ekn .mk { transform-origin: 50px 50px; }
.ekn.eturn .mk { animation: knturn 4.2s ease-in-out infinite; }
@keyframes knturn { 0%, 100% { transform: rotate(var(--a0)); } 45%, 60% { transform: rotate(var(--a1)); } }
.ekgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); justify-items: center; }
/* the F1 / F2 pair (OCT- / OCT+) */
.fpair { display: flex; gap: 6px; box-sizing: border-box; padding: 5px; background: var(--t-bed); border-radius: 14px; }
.fpair span { flex: 1; border-radius: 10px; background: var(--t-key); box-shadow: inset 0 2px 0 var(--t-hi), 0 3px 0 var(--t-lo); color: var(--t-keyText); font: 700 14px/1 "Chakra Petch"; letter-spacing: .06em; display: grid; place-items: center; }
/* the 240 x 240 screen in its bezel (Screen.dc), here FIZZ's own frames (tools/render_frames) */
.fscr { box-sizing: border-box; background: var(--t-bezel); box-shadow: 0 4px 0 rgba(0, 0, 0, .25); position: relative; }
.fscr img { display: block; width: 100%; height: 100%; }
.fscr::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(135deg, rgba(255, 255, 255, .06), transparent 40%); }
.pled { width: 10px; height: 10px; border-radius: 2px; background: #FF3B2F; box-shadow: 0 0 8px #FF3B2F; flex: none; }
/* the button well (Buttons.dc): FIZZ's names */
.ebgrid { display: grid; padding: 10px; background: var(--t-bed); box-shadow: inset 0 2px 0 rgba(0, 0, 0, .18); box-sizing: border-box; }
.ebgrid .ebt { border-radius: calc(var(--bh) * .24); background: var(--t-key); box-shadow: inset 0 2px 0 var(--t-hi), 0 4px 0 var(--t-lo); color: var(--t-keyText); font: 700 var(--bf, 12px)/1.05 "Chakra Petch"; letter-spacing: .02em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center; white-space: nowrap; }
.ebgrid .ebt svg { width: var(--ic, 9px); height: var(--ic, 9px); }
.ebgrid .ebt.on { background: var(--t-hi); color: var(--t-led); text-shadow: 0 0 8px var(--t-led); }
.ebgrid .ebt.go { color: #4FE08A; text-shadow: 0 0 9px #4FE08A; animation: beat .49s ease-out infinite; }
@keyframes beat { 0% { box-shadow: inset 0 2px 0 var(--t-hi), 0 4px 0 var(--t-lo), 0 0 18px #4FE08A; } 60%, 100% { box-shadow: inset 0 2px 0 var(--t-hi), 0 4px 0 var(--t-lo), 0 0 0 transparent; } }
/* the LED keybed (Keys.dc) */
.kbed { position: absolute; background: var(--t-bed); box-shadow: inset 0 3px 0 rgba(0, 0, 0, .2); }
.kbed .stage { position: absolute; overflow: hidden; }
.kbed .ky { position: absolute; border-radius: var(--r); background: var(--t-key); box-shadow: inset 0 2px 0 var(--t-hi), 0 4px 0 var(--t-lo); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.kbed .ky.hd { background: var(--t-hi); }
.kbed .ky i { display: block; border-radius: 3px; background: var(--t-ledOff); }
.kbed .ky.on i { background: var(--t-led); opacity: .62; }
.kbed .ky.hd i, .kbed .ky.held i { background: var(--t-led); opacity: 1; box-shadow: 0 0 10px var(--t-led), 0 0 3px var(--t-led); }
.kbed .ky b { font: 700 12px/1 "Chakra Petch"; color: var(--t-keyText); }
.kbed .ky.ewave i { animation: ewave var(--cyc) steps(1, end) infinite; animation-delay: var(--dl); }
@keyframes ewave { 0% { background: var(--t-led); opacity: 1; box-shadow: 0 0 12px var(--t-led), 0 0 3px var(--t-led); } 6.25%, 100% { box-shadow: none; } }
.kbed .mini { position: absolute; display: flex; gap: 2px; }
.kbed .mini span { flex: 1; border-radius: 4px; background: var(--t-key); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; box-sizing: border-box; }
.kbed .mini span.in { background: var(--t-hi); }
.kbed .mini span i { width: 55%; height: 3px; border-radius: 2px; background: var(--t-ledOff); }
.kbed .mini span.on i { background: var(--t-led); box-shadow: 0 0 6px var(--t-led); }
.kbed .mini .win { background: transparent; padding: 0; position: absolute; top: -3px; border: 2px solid var(--t-keyText); border-radius: 7px; box-sizing: border-box; }
/* the linked views' switches (PhoneKeys) */
.kset { display: flex; gap: 6px; justify-content: center; }
.kset span { height: 36px; padding: 0 12px; border-radius: 999px; color: var(--t-label); font: 700 12px/36px "Chakra Petch"; letter-spacing: .1em; }
.kset span.on { background: rgba(0, 0, 0, .18); }
.deck { display: flex; height: 40px; padding: 3px; border-radius: 999px; background: rgba(0, 0, 0, .16); box-sizing: border-box; }
.deck span { flex: 1; border-radius: 999px; color: var(--t-label); font: 700 13px/34px "Chakra Petch"; letter-spacing: .1em; text-align: center; }
.deck span.on { background: var(--t-key); color: var(--t-keyText); }
.vdots { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; }
.vdots span { width: 36px; height: 24px; display: grid; place-items: center; }
.vdots span i { width: 8px; height: 8px; border-radius: 4px; background: var(--t-label); opacity: .35; }
.vdots span.on i { width: 22px; opacity: 1; }
/* the pull-down sheet (PhoneSheet): the app's own tab bar rides at its foot */
.esheet { position: absolute; left: 0; right: 0; top: 0; z-index: 70; padding: 58px 18px 0; background: #17140F; border-radius: 0 0 34px 34px; box-shadow: 0 18px 40px rgba(0, 0, 0, .45); color: #F3EBDC; animation: sheetdrop .6s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes sheetdrop { from { transform: translateY(-100%); } }
.esheet .ttl { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.esheet .ttl .bub { width: 30px; height: 30px; }
.esheet .ttl b { font: 800 22px "Inter Tight"; letter-spacing: .04em; color: #F3EBDC; display: flex; align-items: center; gap: 9px; }
.esheet .edone { height: 44px; padding: 0 18px; border-radius: 999px; background: #2A251F; font: 800 14px/44px "Inter Tight"; letter-spacing: .06em; }
.esheet h4 { margin: 18px 0 9px; font: 800 12px/1 "Inter Tight"; letter-spacing: .16em; color: #A69C8A; }
.esheet .esrcs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.esheet .esrc { height: 76px; border-radius: 20px; border: 1px solid #3A352D; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 7px; }

.srch .caret { height: 22px; width: 2.5px; margin-left: -6px; vertical-align: 0; }

.srow .btn.small { height: 44px; border-radius: 22px; padding: 0 14px; font-size: 13px; gap: 6px; }
.srow .btn.small svg { width: 16px; height: 16px; }
.lhead.src .seg button em { font-style: normal; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #2a2a33; color: var(--text); font-size: 12px; display: inline-grid; place-items: center; letter-spacing: 0; }

.lsec { display: flex; align-items: center; gap: 8px; margin: 2px 2px 8px; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--muted); }

.lsec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.lsec .phg { width: 12px; height: 14px; color: var(--champagne); }
.cas .nm u { text-decoration: none; color: #000; background: var(--cream); border-radius: 4px; padding: 0 2px; }
.cas.kp .nm u { background: var(--champagne); }
.cas.off { opacity: .32; }
/* a ticked unit row (cream: LIBRARY's colour; the phone's own are champagne) */
.cas.pk2 { border-color: var(--cream); background: color-mix(in srgb, var(--cream) 8%, var(--raised)); box-shadow: 0 0 14px color-mix(in srgb, var(--cream) 18%, transparent); }
.cas.pk2 .ck { background: var(--cream); border-color: var(--cream); }

.cas.pk2.last .ck { animation: ckpop 2.4s ease-out infinite; }
/* the bulk bar (LIBRARY, a unit's presets ticked): takes the tab bar's place */
.bulk { position: absolute; left: 12px; right: 12px; bottom: 28px; z-index: 55; border-radius: 26px; padding: 12px; background: color-mix(in srgb, var(--cream) 6%, #0e0e12); border: 2px solid var(--cream); box-shadow: 0 -12px 34px #000, 0 0 24px color-mix(in srgb, var(--cream) 18%, transparent); }
.bulk .top { display: flex; align-items: center; gap: 8px; margin: 0 0 10px 6px; }
.bulk .n { font-size: 46px; font-weight: 800; color: var(--cream); line-height: .9; font-variant-numeric: tabular-nums; }
.bulk .rings { display: flex; margin: 0 auto 0 4px; }
.bulk .rings i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--c); background: #0e0e12; margin-left: -6px; }
.bulk .rings i:first-child { margin-left: 0; }
.bulk .top .btn { height: 40px; font-size: 13px; padding: 0 14px; }
.bulk .icon.vi { border-color: color-mix(in srgb, var(--violet) 60%, transparent); } .bulk .icon.vi svg { stroke: var(--violet); }
.bulk .icon.red { border-color: color-mix(in srgb, var(--red) 55%, transparent); } .bulk .icon.red svg { stroke: var(--red); }
.btools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-bottom: 10px; }
.bto { height: 46px; border-radius: 23px; border: 1.5px solid color-mix(in srgb, var(--c) 60%, var(--line)); background: color-mix(in srgb, var(--c) 8%, transparent); color: var(--text); display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-size: 13px; letter-spacing: .07em; white-space: nowrap; }

.bto .chev { font-size: 11px; color: var(--c); }
.bto.on { background: var(--c); color: #000; border-color: var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 45%, transparent); }
.bto.dis { opacity: .3; }
.bsend { width: 100%; height: 56px; border-radius: 28px; --c: var(--emu); animation: breathe 2.2s ease-in-out infinite; }
.bsend .phg { width: 17px; height: 20px; }
.bsend .dst { margin-left: 2px; }
/* the TAG chooser and the delete confirm (FizzSheets) */
.tsh .shd { display: flex; align-items: center; gap: 10px; margin: 0 2px 14px; }
.tsh .shd .big { font-size: 34px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: .02em; }

.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.tg { height: 72px; border-radius: 20px; border: 2px solid color-mix(in srgb, var(--c) 65%, var(--line)); background: color-mix(in srgb, var(--c) 9%, #0d0d11); display: flex; align-items: center; gap: 12px; padding: 0 16px; font-weight: 800; font-size: 18px; letter-spacing: .08em; color: var(--text); position: relative; }

.tg.on { background: var(--c); border-color: var(--c); color: var(--tx, #000); box-shadow: 0 0 26px color-mix(in srgb, var(--c) 55%, transparent); }
.tg.on svg { stroke: var(--tx, #000); }
.tg.on::after { content: ""; position: absolute; inset: -2px; border-radius: 20px; border: 2px solid var(--c); animation: utap 1.6s ease-out infinite; }

.tg .cnt2 { margin-left: auto; display: flex; gap: 3px; }
.tg .cnt2 i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tg.on .cnt2 i { background: var(--tx, #000); }
.cfm { --c: var(--red); }
.cfm .ctop { display: flex; align-items: center; gap: 14px; margin: 2px 2px 14px; }
.cfm .cic { width: 58px; height: 58px; border-radius: 18px; border: 2px solid var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); display: grid; place-items: center; flex: none; }
.cfm .cic svg { width: 30px; height: 30px; fill: none; stroke: var(--red); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cfm .ct2 { font-size: 30px; font-weight: 800; color: var(--text); line-height: 1.02; letter-spacing: .01em; }
.cfm .ct2 small { display: block; font-size: 13px; letter-spacing: .1em; color: var(--muted); margin-top: 4px; }
.cfm .crow { height: 46px; border-radius: 12px; background: var(--raised); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 12px; margin-bottom: 6px; color: var(--text); font-weight: 800; font-size: 15px; letter-spacing: .03em; }
.cfm .crow .algo { width: 26px; height: 26px; }
.cfm .crow .sl { color: var(--muted); font-size: 13px; width: 20px; text-align: right; }
.cfm .crow .uu { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; box-shadow: 0 0 10px color-mix(in srgb, var(--yellow) 50%, transparent); }
.cfm .crow .uu svg { width: 13px; height: 13px; fill: none; stroke: #000; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.cwarn { border-radius: 16px; border: 2px solid var(--yellow); background: color-mix(in srgb, var(--yellow) 9%, #0d0d11); padding: 11px 12px 12px; margin: 10px 0 14px; }
.cwarn .wh { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; letter-spacing: .08em; color: var(--yellow); margin-bottom: 9px; }
.cwarn .wh svg { width: 20px; height: 20px; fill: none; stroke: var(--yellow); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.cwarn .wh b { color: var(--yellow); font-size: 20px; letter-spacing: 0; }
.cwarn .row { gap: 7px; flex-wrap: wrap; }
.cwarn .uchip { height: 36px; font-size: 14px; }
.cwarn .back { margin-top: 9px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: var(--body); letter-spacing: .04em; }
.cwarn .back i { display: flex; gap: 3px; } .cwarn .back i s { width: 14px; height: 14px; border-radius: 4px; background: var(--c); text-decoration: none; }
.cbtns { display: flex; gap: 8px; }
.cbtns .btn { flex: 1; height: 56px; border-radius: 28px; }
.cbtns .btn.go { --c: var(--red); flex: 1.4; color: #000; }
/* PROJECTS: a pattern lifted */
.pgr.dz .pp { border-color: color-mix(in srgb, var(--cyan) 30%, #1c1c22); }
.pgr.dz .pp.u { border-color: color-mix(in srgb, var(--cyan) 38%, #2a2a33); }
.pp.lifted { background: transparent; border: 1.5px dashed var(--cyan); }
.pp.lifted > svg { opacity: .18; }
.pp.lifted .no { color: var(--cyan); }
.sc.dt { border: 1.5px dashed color-mix(in srgb, var(--cyan) 70%, transparent); color: var(--cyan); }
.sc.dt.hit { background: var(--cyan); border-style: solid; color: #000; box-shadow: 0 0 18px color-mix(in srgb, var(--cyan) 60%, transparent); animation: hitc 1.4s ease-out infinite; }
@keyframes hitc { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--cyan) 75%, transparent); } 100% { box-shadow: 0 0 0 13px transparent; } }
.spring { position: absolute; z-index: 40; width: 250px; border-radius: 20px; border: 2px solid var(--cyan); background: color-mix(in srgb, var(--cyan) 9%, #0b0b0e); padding: 11px 12px 12px; box-shadow: 0 18px 40px #000, 0 0 30px color-mix(in srgb, var(--cyan) 35%, transparent); animation: mpop .5s cubic-bezier(.2, 1.4, .4, 1) both; transform-origin: 30px 0; }
.spring .sh1 { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.spring .sh1 i { width: 26px; height: 26px; border-radius: 13px; background: var(--green); color: #000; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 14px; }
.spring .sh1 b { font-size: 19px; font-weight: 800; color: var(--text); }
.spring .sh1 em { margin-left: auto; font-style: normal; font-size: 14px; font-weight: 800; color: #000; background: var(--cyan); border-radius: 9px; padding: 3px 8px; }
.mgrid { display: grid; grid-template-columns: 12px repeat(16, 1fr); gap: 3px 3px; align-items: center; }
.mgrid .bl { font-size: 11px; font-weight: 800; color: var(--muted); }
.mgrid s { aspect-ratio: 1; border-radius: 50%; border: 1.5px solid #3a3a44; text-decoration: none; }
.mgrid s.u { background: #6a6a74; border-color: #6a6a74; }
.mgrid s.ff { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink .6s infinite alternate; }
.pghost { position: absolute; z-index: 46; width: 92px; height: 66px; border-radius: 11px; border: 2px solid var(--cyan); background: color-mix(in srgb, var(--cyan) 14%, var(--raised)); padding: 17px 5px 5px; transform: rotate(-5deg); box-shadow: 0 18px 30px #000, 0 0 26px color-mix(in srgb, var(--cyan) 55%, transparent); animation: gfloat 2.2s ease-in-out infinite; }
@keyframes gfloat { 50% { transform: rotate(-3deg) translateY(-5px); } }
.pghost .no { position: absolute; left: 6px; top: 1px; font-size: 13px; font-weight: 800; color: var(--cyan); }
.pghost svg { display: block; width: 100%; height: 100%; }
.pghost .gb { position: absolute; right: -10px; top: -12px; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--cyan); color: #000; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px; letter-spacing: .03em; box-shadow: 0 0 0 2px #000; }
.pghost .gb svg { width: 12px; height: 12px; fill: none; stroke: #000; stroke-width: 2.6; }
/* the TO… sheet */
.tosh { --c: var(--cyan); }
.tosh .toh { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.tosh .src { height: 40px; padding: 0 12px; border-radius: 12px; background: var(--cyan); color: #000; font-weight: 800; font-size: 20px; display: grid; place-items: center; box-shadow: 0 0 16px color-mix(in srgb, var(--cyan) 50%, transparent); }
.tosh .sfrom { font-size: 15px; font-weight: 800; color: var(--muted); letter-spacing: .05em; }
.tosh .seg { margin-left: auto; --c: var(--cyan); }
.tosh .seg button { height: 40px; padding: 0 13px; }
.tosh .seg button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.tprj { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 12px; }
.tpj { height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--raised); display: flex; align-items: center; gap: 8px; padding: 0 9px 0 6px; font-weight: 800; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; position: relative; }
.tpj i { width: 26px; height: 26px; border-radius: 13px; background: var(--green); color: #000; display: grid; place-items: center; font-style: normal; font-size: 13px; flex: none; }
.tpj.on { border: 2px solid var(--cyan); background: color-mix(in srgb, var(--cyan) 16%, var(--raised)); box-shadow: 0 0 16px color-mix(in srgb, var(--cyan) 40%, transparent); }
.tpj.on i { background: var(--cyan); }
.tpj.full { border: 1.5px dashed color-mix(in srgb, var(--red) 70%, transparent); color: var(--muted); background: transparent; }
.tpj.full i { background: #2a2a33; color: var(--muted); }
.tpj.full em { position: absolute; right: 5px; top: 4px; font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .04em; color: #000; background: var(--red); border-radius: 5px; padding: 1px 4px; }
.tpj.full .pf { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--red); opacity: .8; }
.tgr { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.tgr .r { display: grid; grid-template-columns: 14px repeat(16, 1fr); gap: 3px; align-items: center; }
.tgr .bl { font-size: 12px; font-weight: 800; color: var(--muted); }
.tgr s { height: 24px; border-radius: 6px; background: #0f0f13; border: 1.5px solid #1f1f26; text-decoration: none; }
.tgr s.u { background: #2c2c35; border-color: #3a3a44; }
.tgr s.ff { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
.tgr s.rp { border: 2px solid var(--yellow); background: color-mix(in srgb, var(--yellow) 25%, #2c2c35); }
.tsnd { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.tsnd .pi { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; border: 1.5px solid color-mix(in srgb, var(--green) 60%, transparent); background: color-mix(in srgb, var(--green) 10%, transparent); flex: none; }
.tsnd .pi svg { width: 18px; height: 18px; fill: var(--green); }
.tsnd .sd { height: 36px; padding: 0 11px; border-radius: 18px; display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; color: var(--text); border: 1.5px solid var(--line); white-space: nowrap; }
.tsnd .sd.add { border-color: var(--green); color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); }
.tsnd .sd .dts { display: inline-flex; gap: 3px; } .tsnd .sd .dts i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.tsnd .pm { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; font-weight: 800; color: var(--muted); }
.tsnd .pm b { font-size: 14px; }
.tsnd .pm .meter { width: 74px; height: 8px; border-radius: 4px; }
.tosh .cbtns .go { --c: var(--cyan); animation: breathe 2.2s ease-in-out infinite; }
.tosh .cbtns .go b { color: #000; height: 28px; padding: 0 8px; border-radius: 9px; background: rgba(0, 0, 0, .14); display: grid; place-items: center; font-size: 16px; }
/* BACKUPS: ▶ plays a backup on a throwaway phone FIZZ */
.bk .bplay { width: 42px; height: 42px; border-radius: 21px; background: color-mix(in srgb, var(--emu) 16%, transparent); border: 2px solid var(--emu); display: grid; place-items: center; flex: none; margin-right: 2px; }

.bk .bplay.tap svg { fill: #000; }

.bk:has(.bplay) { gap: 9px; }

.bk.ring { border-color: color-mix(in srgb, var(--emu) 70%, var(--line)); box-shadow: 0 0 18px color-mix(in srgb, var(--emu) 25%, transparent); }

.pan .tr::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: #33333b; }

/* ================================================================ 49–54: PLAY as an exact copy of RemoteFM1 for iOS (each frame beside the real screen) */
/* Drawn from RemoteFM1's own screens (simctl shots, FIZZ's core loaded) and measured in points; no RemoteFM1 code.

   sheet's title (all OFL, fonts/). Prefix .c = the copy. */
@font-face { font-family: "DM Sans"; src: url("fonts/DMSans.ttf") format("truetype"); font-weight: 100 1000; }
@font-face { font-family: "Unbounded"; src: url("fonts/Unbounded.ttf") format("truetype"); font-weight: 200 900; }

function bubbles(n, seed, cols = ["--champagne", "--champagne", "--champagne", "--cyan", "--pink", "--yellow"]) {
  const r = rnd(seed); let s = "";

// an arc, angles clockwise from 12 o'clock
function arc(cx, cy, r, a0, a1) {

const ALGOS = [[[6, 0, 8, 0], 1, 1, 4], [[2, 0, 8, 0], 3, 1, 4], [[2, 0, 2, 2], 1, 9, 4], [[2, 4, 8, 0], 3, 1, 4], [[2, 12, 0, 0], 2, 1, 2], [[10, 0, 10, 0], 1, 1, 4], [[2, 0, 8, 0], 1, 3, 12], [[2, 0, 0, 0], 2, 9, 4]];
const OPS = [["C", "--k1"], ["A", "--k2"], ["B1", "--k3"], ["B2", "--k4"]];
function algoSvg(al, hot = -1, vb = "0 10 600 390", ax = 0) {
  const [mods, fb, ox, oy] = ALGOS[al - 1], out = ox | oy, dep = [0, 0, 0, 0];
  for (let it = 0; it < 4; it++) for (let t = 0; t < 4; t++) for (let o = 0; o < 4; o++) if (o !== t && ((mods[t] >> o) & 1) && dep[o] < dep[t] + 1) dep[o] = dep[t] + 1;
  const n = [0, 0, 0, 0], row = [0, 0, 0, 0]; let md = 0;
  for (let o = 0; o < 4; o++) { row[o] = n[Math.min(3, dep[o])]++; md = Math.max(md, dep[o]); }
  const sp = md >= 3 ? 82 : md === 2 ? 108 : 124, R = 40, BUS = 372, x = [], y = [];
  for (let o = 0; o < 4; o++) { const d = Math.min(3, dep[o]), cnt = n[d]; x[o] = 340 + (row[o] - (cnt - 1) / 2) * 130 + (md >= 3 && cnt === 1 ? (d % 2 ? 34 : -34) : 0); y[o] = BUS - 66 - d * sp; }
  const sx = 20 / 127 + 0.5, sy = 1 - sx;
  const parts = [`<line x1="150" y1="${BUS}" x2="520" y2="${BUS}" class="bus"/>`, `<path d="M528 ${BUS - 12}h12v24h-12zM540 ${BUS - 12}l16-14v52l-16-14" class="spk"/><path d="M566 ${BUS - 16}a22 22 0 0 1 0 32" class="spk wave"/>`];
  for (let o = 0; o < 4; o++) if ((out >> o) & 1) {
    const sh = (ox >> o) & 1 && (oy >> o) & 1 ? 1 : (ox >> o) & 1 ? sx : sy, lw = 2 + 6 * sh, cx = dep[o] ? x[o] + R + 10 : x[o];
    if (dep[o]) parts.push(`<path d="M${x[o] + R} ${y[o]} H${cx} V${BUS}" class="carrier" style="stroke-width:${lw.toFixed(1)};opacity:${(0.35 + 0.65 * sh).toFixed(2)}"/>`);
    else parts.push(`<line x1="${cx}" y1="${y[o] + R}" x2="${cx}" y2="${BUS}" class="carrier" style="stroke-width:${lw.toFixed(1)};opacity:${(0.35 + 0.65 * sh).toFixed(2)}"/>`);
    parts.push(`<circle cx="${cx}" cy="${BUS}" r="${(3 + 2 * sh).toFixed(1)}" class="joint"/>`);
  }
  for (let t = 0; t < 4; t++) for (let o = 0; o < 4; o++) if (o !== t && ((mods[t] >> o) & 1)) {
    const dx = x[t] - x[o], dy = y[t] - y[o], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l;
    const sx0 = x[o] + ux * (R + 2), sy0 = y[o] + uy * (R + 2), ex = x[t] - ux * (R + 6), ey = y[t] - uy * (R + 6);
    parts.push(`<line x1="${sx0.toFixed(1)}" y1="${sy0.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" class="modl"/>` +
      `<path d="M${ex.toFixed(1)} ${ey.toFixed(1)} l${(-ux * 14 - uy * 8).toFixed(1)} ${(-uy * 14 + ux * 8).toFixed(1)} l${(uy * 16).toFixed(1)} ${(-ux * 16).toFixed(1)} z" class="arrow"/>` +
      `<circle r="6" class="spark"><animateMotion dur="${(1.1 + 0.15 * (o + t)).toFixed(2)}s" repeatCount="indefinite" path="M${sx0.toFixed(1)} ${sy0.toFixed(1)} L${ex.toFixed(1)} ${ey.toFixed(1)}"/></circle>`);
  }
  if (fb < 4) parts.push(`<path d="M${x[fb] + R * 0.7} ${y[fb] - R * 0.7} a28 28 0 1 1 ${R * 0.5} ${R * 0.95}" class="fb" style="stroke:var(${OPS[fb][1]})"/>`);
  OPS.forEach(([nm, c], o) => parts.push(`<g class="op ${hot === o ? "on" : ""}" style="--c:var(${c})"><circle cx="${x[o]}" cy="${y[o]}" r="${R}"/><text x="${x[o]}" y="${y[o] + 11}" text-anchor="middle">${nm}</text></g>`));
  parts.push(`<text x="${14 + ax}" y="${ax ? 92 : 62}" class="algolab">ALGO</text><text x="${6 + ax}" y="${ax ? 226 : 196}" class="algonum">${al}</text>`);
  return `<svg class="algosvg" viewBox="${vb}">${parts.join("")}</svg>`;
}

// a pattern's trigs, six tracks × 16 steps, seeded
function trigs(seed) {
  const r = rnd(seed); let s = "";
  for (let t = 0; t < 6; t++) {
    if (t && r() < 0.25) continue;
    const d = [0, 0.38, 0.2, 0.3, 0.16, 0.24][t];
    for (let x = 0; x < 16; x++) {

    }
  }
  return `<svg viewBox="0 0 16 6" preserveAspectRatio="none">${s}</svg>`;
}

// the 16 step pads (the FM-1's white keys, FIZZ's steps 1–16), in the theme's LED colour; held ones glow with the notes played
function stepPads({ x, y, W, H, rows = 2, steps, head = -1, held = {} }) {
  const pad = rows === 1 ? 12 : 10, g = rows === 1 ? 8 : 6, per = 16 / rows;
  const pw = (W - 2 * pad - (per - 1) * g) / per, ph = (H - 2 * pad - (rows - 1) * g) / rows;
  let s = "";
  for (let i = 0; i < 16; i++) {
    const r = Math.floor(i / per), c = i % per, hl = held[i];
    const cls = ["spd", steps[i] ? "on" : "", i === head ? "hd" : "", hl ? "held" : ""].join(" ");
    s += `<span class="${cls}" style="left:${(pad + c * (pw + g)).toFixed(1)}px;top:${(pad + r * (ph + g)).toFixed(1)}px;width:${pw.toFixed(1)}px;height:${ph.toFixed(1)}px;--r:${Math.round(Math.min(pw, ph) * 0.26)}px">` +
      `<i style="height:${Math.round(ph * 0.36)}px"></i><b>${i + 1}</b>${hl ? `<span class="nd">${hl.map((nc) => `<s style="--nc:var(${nc})"></s>`).join("")}</span>` : ""}</span>`;
  }
  return `<div class="spads" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px;border-radius:${Math.round(Math.min(W, H) * 0.12)}px">${s}</div>`;
}
// a chromatic keyboard from C<oct>, n white keys; down: {name: note colour}
function piano({ x, y, W, H, oct = 4, n = 11, down = {} }) {
  const pad = 9, g = 4, ww = (W - 2 * pad + g) / n, kw = ww - g, L = "CDEFGAB";
  let s = "", o = oct;
  const names = [];
  for (let i = 0; i < n; i++) { const l = L[i % 7]; if (i && l === "C") o++; names.push(l + o); }
  names.forEach((nm, i) => {
    const d = down[nm];
    s += `<span class="pnk w ${d ? "dn" : ""}" style="left:${(pad + i * ww).toFixed(1)}px;top:${pad}px;width:${kw.toFixed(1)}px;height:${H - 2 * pad}px;padding-bottom:12px${d ? `;--nc:var(${d})` : ""}">${d ? "<s></s>" : ""}${nm[0] === "C" || d ? `<b>${nm}</b>` : ""}</span>`;
  });
  names.forEach((nm, i) => {
    if (!"CDFGA".includes(nm[0]) || i === n - 1) return;
    const bn = nm[0] + "#" + nm.slice(1), d = down[bn], bw = ww * 0.62, cx = pad + (i + 1) * ww - g / 2;
    s += `<span class="pnk k ${d ? "dn" : ""}" style="left:${(cx - bw / 2).toFixed(1)}px;top:${pad}px;width:${bw.toFixed(1)}px;height:${Math.round((H - 2 * pad) * 0.58)}px;padding-bottom:9px${d ? `;--nc:var(${d})` : ""}">${d ? "<s></s>" : ""}</span>`;
  });
  return `<div class="pkb" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px;border-radius:${Math.round(Math.min(W, H) * 0.08)}px">${s}</div>`;
}

// ---------------------------------------------------------------- 49–54: PLAY as an exact copy of RemoteFM1 for iOS
// Each frame stands beside the RemoteFM1 screen it copies (screens/rfm1: RemoteFM1 for iOS in the simulator with FIZZ's
// own core loaded, Tangerine, same moment). The numbers are measured on those screens, in points; nothing of
// RemoteFM1's code is used (it is GPL-3.0; the app reimplements the look). FIZZ keeps its own names (the 12 buttons,
// F1 / F2), its screen, and its extras: the STEPS view, the FIZZ badge (back to the manager), the backup pill.
const RFM_DOTS = (n, on, bottom = 18) => `<div class="cdots" style="bottom:${bottom}px">${Array.from({ length: n }, (_, i) => `<span class="${i === on ? "on" : ""}"><i></i></span>`).join("")}</div>`;
// a knob (RemoteFM1's: the dark body, the knurled ring, the cap, a white pointer, the hard shadow), centred at cx;
// its label (Chakra Petch, max(9, 17 % of the knob)) above, its line top lf + 6 pt over the knob
function cknob(label, cx, top, size, angle = 0) {
  const lf = Math.max(9, Math.round(size * 0.17 * 2) / 2), sh = Math.max(3, Math.round(size * 0.06));
  return `<span class="ckl" style="left:${cx}px;top:${top - lf - 6}px;font-size:${lf}px">${label}</span>` +
    `<span class="ckn" style="left:${cx - size / 2}px;top:${top}px;width:${size}px;height:${size}px;box-shadow:0 ${sh}px 0 rgba(0,0,0,.28)"><svg width="${size}" height="${size}" viewBox="0 0 100 100">` +
    `<circle cx="50" cy="50" r="50" style="fill:var(--t-knob)"/><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="8" stroke-dasharray="3.2 3.9"/>` +
    `<circle cx="50" cy="50" r="36" style="fill:var(--t-knob)"/><circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.07)"/>` +

function cwell(x, y, cols, bw, bh, gap, pad, items, { bf = Math.max(10, Math.round(bh * 0.26 * 2) / 2), r = null, wr = null } = {}) {

    items.map((it) => `<span class="cbt ${it.cls || ""}" style="height:${bh}px;border-radius:${rad}px;--bf:${bf}px;--gl:${Math.max(6, Math.round(bh * 0.15))}px">${it.html}</span>`).join("") + "</div>";

    `<span class="lg" style="font-size:${fs}px;letter-spacing:${tr}em;padding-left:${tr}em">${n.replace(" ", "<br>")}</span>` };

const tog = (on = true) => `<span class="m-tgl2 ${on ? "" : "off"}"></span>`;
const chevv = (v = "") => `<span class="v">${v}${CHEV1}</span>`;
const mapRow = (t, src, mode) => li(`<span class="m-mp"><b>${t}</b><em>←</em>${src}</span>${t === "MASTER" ? '<span class="m-pk">picks up</span>' : ""}`, (mode ? `<span class="m-mode">${mode}${UPDN}</span>` : "") + `<span class="m-xm">${IC.x}</span>`, "m-r52 m-mrow");
function midiPageBody(part) {
  if (part === "input") return `<div class="list m-r">${li("All inputs", "")}${li("None", "")}${li("KeyStep 37", TICK1)}${li("nanoKONTROL2", "")}</div>
    <p class="m-nt">2 found. The FM-1 in use, an FM-1 used as the panel and an OMX-27 in REMOTE mode are not listed.</p>`;
  const audio = `<h4 style="margin-top:12px">Audio</h4><div class="list m-r">${li("Sound", tog())}</div>
    <p class="m-nt">48000 Hz, io buffer 5.3 ms, Speaker; 18.7 ms ahead, 0 underruns</p>`;
  const midi = `<h4>MIDI</h4><div class="list m-r">${li("MIDI input", chevv("KeyStep 37"))}${li("MIDI notes play keys", tog())}${li("…and reach FIZZ's MIDI in", tog(false))}
    ${li("Transpose", '<span class="m-stp"><b>+1 oct</b><span><i>−</i><i>+</i></span></span>')}${li("Bluetooth MIDI devices", chevv())}</div>
    <p class="m-nt">A MIDI keyboard plays the keys (transposed by octaves); its other notes, CCs and clock, and every note when they don't play the keys, go to FIZZ's MIDI in.</p>`;
  const knobs = `<h4>Knobs from MIDI</h4><div class="list m-r">${li('<span class="m-two">MIDI learn<small>5 learned</small></span>', '<span class="m-acc">Learn</span>', "m-r52")}
    ${li("Knob speed", '<span class="m-seg2"><span>½×</span><span class="on">1×</span><span>2×</span></span>')}${li("MASTER pickup", tog())}</div>
    <p class="m-nt">Tap Learn, then a knob or button on the panel, then move a control on your MIDI device.</p>
    <div class="list m-r" style="margin-top:12px">${mapRow("KN1", "CC 21 ch 1", "absolute")}${mapRow("KN2", "CC 22 ch 1", "rel. 64 ± n")}${mapRow("KN3", "CC 23 ch 1", "absolute")}${mapRow("MASTER", "CC 7 ch 1")}${mapRow("PLAY", "note 36 ch 10")}</div>
    <div class="m-clr"><span>Clear all</span></div>`;
  const omx = `<h4>OMX-27</h4><p class="m-pp">An OMX-27 becomes PLAY's controller: its keys, encoder and pots play the panel; FIZZ lights its keys and draws its screen. K1 picks the view, K2 the colours, K5 is MASTER.</p>
    <span class="m-acc gh inl">Disconnect</span><div class="m-st"><i></i>Connected · REMOTE mode · Base view</div>
    <p class="m-nt">Needs the OMX-27 firmware with REMOTE mode, over USB. To leave remote mode, hold AUX and the encoder.</p><div style="height:24px"></div>`;
  return audio + midi + knobs + omx;
}
function cpMidiPage(part = "top") {
  const scroll = { top: 0, knobs: 514, omx: 860 }[part] || 0;
  const head = part === "input" ? `<div class="m-bk">${BACK1}MIDI &amp; audio</div><div class="m-pt">MIDI input</div>` : `<div class="m-bk">${BACK1}Play</div><div class="m-pt">MIDI &amp; audio</div>`;
  return `<div class="a" style="inset:0;background:rgba(10,8,6,.5);z-index:60"></div><div class="csheet pg">${head}
    <div class="m-pgb"><div class="m-pgi" style="top:${-scroll}px">${midiPageBody(part === "input" ? "input" : "all")}</div></div>
    ${nav6("PLAY")}<div class="close"><span></span></div></div>`;
}
const midiPhone = (part) => cphone(cpFull() + cpMidiPage(part)).replace('class="scr emus"', 'class="scr emus sbl"');

// ---- 56: MIDI learn on the panel
// a knob's learn ring (RemoteFM1's LearnRing: r = size / 2 + 6; dashed when learnable, solid with a dot when bound,
// thick and pulsing when picked) and MASTER's pickup mark (PotMark: a hollow dot at the pot's place, r = size / 2 + 5)
function lring(cx, top, size, st) {
  const r = size / 2 + 6, cy = top + size / 2;
  const sw = st === "s" ? 3.2 : st === "b" ? 2 : 1.5, op = st === "s" ? 1 : st === "b" ? .95 : .6, dash = st ? "" : 'stroke-dasharray="4 4"';
  const glow = st === "s" ? "filter:drop-shadow(0 0 5px var(--t-label))" : "";
  return `<span class="lring ${st}" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px"><svg width="${2 * r}" height="${2 * r}" style="${glow}"><circle cx="${r}" cy="${r}" r="${r - sw / 2}" fill="none" style="stroke:var(--t-label)" stroke-width="${sw}" opacity="${op}" ${dash}/></svg>` +
    (st === "b" ? `<span class="bd" style="left:${r + r * 0.71}px;top:${r - r * 0.71}px"></span>` : "") + "</span>";
}
const potMark = (cx, top, size, frac) => { const a = (-135 + frac * 270) * Math.PI / 180, r = size / 2 + 5; return `<span class="potm" style="left:${cx + r * Math.sin(a)}px;top:${top + size / 2 - r * Math.cos(a)}px"></span>`; };
// the learn bar (RemoteFM1's LearnBar): at the foot of FULL (y 737), over the top in CONTROLS (y 54)
const learnBar = (y, text, forget = false) => `<div class="clbar" style="top:${y}px"><span class="ld"></span><span class="lt"><b>MIDI LEARN</b><span>${text}</span></span>${forget ? '<span class="pl">Forget</span>' : ""}<span class="pl ac">Done</span></div>`;
const ctoast = (y, text, ok = false) => `<div class="ctoast ${ok ? "ok" : ""}" style="top:${y}px">${text}</div>`;
// FIZZ's 12 buttons with learn outlines: st = { NAME: "b" | "s" }, every other one learnable (dashed)
const fizzBtnsL = (bw, base, st = {}, learn = true) => fizzBtns(bw, base).map((it, i) => ({ ...it, cls: (it.cls || "") + (learn ? ` lrn ${st[FIZZ12[i]] || ""}` : "") }));
const fBtnsL = (f, st = {}, learn = true) => fBtns(f).map((it, i) => ({ ...it, cls: learn ? `lrn ${st[f[i]] || ""}` : "" }));
// FULL with learn on (or off, with MASTER waiting for its pickup)
function cpFullLearn({ st = {}, learn = true, bar = "", forget = false, toast = "", pot = null } = {}) {
  const kn = [76, 163, 250, 337];
  const K = (l, cx, top, ang = 0) => cknob(l, cx, top, 46, ang) + (learn ? lring(cx, top, 46, st[l] || "") : "");
  return chead(52, 28) +
    K("MASTER", 53, 111, -135) + K("SELECT", 127, 111) + K("PRESETS", 53, 186) + K("ALGORITHM", 127, 186) +
    (pot !== null ? potMark(53, 111, 46, pot) : "") +
    cwell(16, 246, 2, 66, 42, 6, 5, fBtnsL(["F1", "F2"], st, learn), { bf: 13, r: 10, wr: 14 }) +
    cscreen(172, 96, 202, "fizz-logo") +
    `<span class="cled" style="left:16px;top:345px;width:10px;height:10px"></span>` +
    kn.map((x, i) => K(`KN${i + 1}`, x, 331, [0, 30, 0, 0][i])).join("") +
    cwell(21, 400, 6, 48, 42, 8, 10, fizzBtnsL(48, 11, st, learn)) +
    keybed({ x: 16, y: 530, W: 358, H: 272, layout: "scroll", keyW: 40, mode: "play", steps: OFF16, wave: false, offset: 4 }) +
    (bar ? learnBar(737, bar, forget) : "") + (toast ? ctoast(744, toast) : "") +
    RFM_DOTS(4, 0, 18);
}
// CONTROLS (54's layout) with KN 1–4 showing and learn on: the bar over the top (it would cover the buttons below)
function cpPanelLearn(st, bar) {
  const kn = [50.5, 146.5, 242.5, 338.5];
  return cscreen(25, 92, 340, "fizz-logo") +
    kn.map((x, i) => cknob(`KN${i + 1}`, x, 459, 50) + lring(x, 459, 50, st[`KN${i + 1}`] || "")).join("") +
    `<div class="a csw" style="left:0;right:0;top:523px"><span>MAIN</span><span class="on">KN 1–4</span></div>` +
    `<div class="a cdeck" style="left:95px;top:565px;width:200px"><span class="on">BUTTONS</span><span>KEYS</span></div>` +
    cwell(15, 611, 6, 50, 48, 8, 10, fizzBtnsL(50, 12.5, st)) +
    cwell(95, 747, 2, 92, 38, 6, 5, fBtnsL(["F1", "F2"], st), { bf: 13, r: 10, wr: 14 }) +
    learnBar(54, bar) + RFM_DOTS(4, 1, 18);
}
const LEARNED = { MASTER: "b", KN1: "b", KN2: "b", PLAY: "b" };

// ---- 57: the unit picker with a RemoteFM1 unit, and PLAY with it as the panel
const LCD_RFM = '<text x="63" y="76" text-anchor="middle" style="font:800 30px Inter Tight;fill:var(--cyan);stroke:none;letter-spacing:.04em">RFM1</text>';
function pickerPanel() {
  const pan = `<div class="urow pan" style="--c:var(--cyan)"><span class="art">${fm1("var(--cyan)", LCD_RFM, 92)}</span><span class="un"><b>FM-1${VIA("USB")}</b><span><span class="rfmv">RemoteFM1</span>0.4.2</span></span>` +
    `<span class="usep">${IC.plug}USE AS PANEL</span></div>`;
  return `<div class="a" style="inset:0;background:rgba(0,0,0,.5);z-index:70"></div><div class="psheet upk" style="top:262px;z-index:75"><div class="grab"></div>
    <div class="h">UNIT <span class="n">3</span></div>
    ${urow("var(--emu)", phoneArt("var(--emu)", 44), "THIS iPHONE", "FIZZ 0.12.0-beta.12", "cur", false)}
    ${pan}
    ${urow("var(--blue)", fm1("var(--blue)", LCD_BUB, 92), "FM-1", "0.12.0-beta.11", "dead", false, "BT")}
    <span class="btn btbtn">${IC.bt}+ BLUETOOTH</span></div><span class="tch" style="left:300px;top:594px;z-index:80"></span>`;
}
// PLAY with the panel attached: the chip as RemoteFM1's linked chip (green dot), the screen and LEDs mirrored on the unit
function cpFullPanel() {
  return cpFullLearn({ learn: false }).replace(chead(52, 28), chead(52, 28, { chip: "FM-1 panel", kind: "lnk" })) + ctoast(744, "FM-1 linked: it is this iPhone's panel", true);
}

SCREENS.push(
  { id: "midi-audio-page", title: "PLAY's sheet › MIDI & audio", cmp8: true, cap: "Top: RemoteFM1's MIDI & audio page (its sheet's list › MIDI & audio), scrolled three ways, and its MIDI input page. Bottom: FIZZ's, in the same place: PLAY's pull-down (53) › MIDI & audio, copied in RemoteFM1's sheet style (#17140F, DM Sans, the back line and the Unbounded title fixed, the rest scrolling; rows 52 high), FIZZ's tab bar and grabber kept at its foot as in 53. AUDIO: Sound (the phone FIZZ's sound) with the audio line. MIDI: MIDI input (a page: All inputs, None or one device; the FM-1 in use, an FM-1 used as the panel and an OMX-27 in REMOTE mode are never listed), MIDI notes play keys (PLAY's keybed, from note 53 up, transposed −2..+2 octaves), …and reach FIZZ's MIDI in (the key notes go there too), everything else (other notes, CCs, clock) to FIZZ's MIDI in; Bluetooth MIDI devices (iOS's pairing). RemoteFM1's 'Look for the FM-1 again' is left out (the unit picker does that). KNOBS FROM MIDI: MIDI learn with Learn (closes the sheet: 56), Knob speed ½× 1× 2× (detents per CC step), MASTER pickup (FIZZ's addition: on, a learned MASTER pot waits until it reaches MASTER; off, it jumps), the learned list (target ← source, an encoder's mode menu, ×), Clear all (asks again inline). OMX-27: the same section, here connected (REMOTE mode, Base view). The map is RemoteFM1's format and ids, so one map reads the same in both apps.",
    html: () => cmpGrid([
      [who(false, "MIDI & audio"), rphone("rfm1-p-midi")], [who(false, "…scrolled: Knobs from MIDI"), rphone("rfm1-p-midi-knobs")],
      [who(false, "…scrolled: OMX-27"), rphone("rfm1-p-midi-omx")], [who(false, "MIDI input"), rphone("rfm1-p-midi-input")],
      [who(true, "MIDI & audio"), midiPhone("top")], [who(true, "…Knobs from MIDI"), midiPhone("knobs")],
      [who(true, "…OMX-27"), midiPhone("omx")], [who(true, "MIDI input"), midiPhone("input")]], 4) },
  { id: "midi-learn-panel", title: "MIDI learn on PLAY's panel", cmp6: true, cap: "Top: RemoteFM1's learn mode (CONTROLS with KN3 picked; FULL with KN1 bound). Bottom: FIZZ's. Learn (55) closes the sheet; every learnable control is outlined: the 8 knobs (MASTER, SELECT, PRESETS, ALGORITHM, KN1–4) with a dashed ring in the label colour (r = knob / 2 + 6), the 12 buttons and F1 / F2 with a dashed outline in the LED colour, 3 pt out; the keybed is not learnable (MIDI notes play it). Bound: solid, a dot on the knob's ring. Left: a tap picks KN3 (thick ring, pulsing, glowing); the bar says what to move: a knob or a pot for a knob, a button or a key for a button; in CONTROLS the bar sits over the top (the buttons reach the foot), in FULL at the foot (y 737). Middle: the CC arrives: KN3 is bound (CC 23, mode guessed: absolute), the bar shows it with Forget (forgets KN3's bindings) and Done. Right: after Done, playing from the controller: MASTER is learned to a pot that is not where MASTER is, so a hollow mark shows the pot's place and the toast says where to turn it; MASTER moves once the pot reaches it (MASTER pickup on, 55). STEPS: KN1–4, OCT− / OCT+ outlined (the step pads too, as buttons: open).",
    html: () => cmpGrid([
      [who(false, "CONTROLS · KN3 picked"), rphone("rfm1-p-learn-kn3-controls")], [who(false, "FULL · KN1 bound"), rphone("rfm1-p-learn-kn1")],
      [who(false, "(no screen for the pickup)"), emptyCell("RemoteFM1 draws the same mark and toast (PotMark, ToastView); no launch argument shows it")],
      [who(true, "KN3 picked: move a knob"), cphone(cpPanelLearn({ ...LEARNED, KN3: "s" }, "KN3: now turn a knob or a pot on your MIDI device"))],
      [who(true, "KN3 bound"), cphone(cpFullLearn({ st: { ...LEARNED, KN3: "b" }, bar: "KN3 ← CC 23 ch 1", forget: true }))],
      [who(true, "Done: MASTER's pickup"), cphone(cpFullLearn({ learn: false, pot: 0.62, toast: "MASTER: turn the pot to 62% to pick it up" }))]], 3) },
  { id: "unit-picker-panel", title: "The unit picker: a RemoteFM1 FM-1 as THIS iPHONE's panel", cmp4: true, cap: "Top: RemoteFM1 with an FM-1 running RemoteFM1's firmware: its sheet's Sound source FM-1 (RemoteFM1 · USB) and the panel with the chip FM-1 linked (green dot). Bottom: FIZZ. Left: the unit picker (34, from PLAY's chip) finds an FM-1 that answers RemoteFM1's HELLO, not FIZZ's. Instead of greying it out, it gets its own row in cyan: its drawing with RemoteFM1's screen, USB, the RemoteFM1 tag and its firmware version, and USE AS PANEL across the row (breathing). THIS iPHONE stays the unit (its tick). Right: tapped: the FM-1 becomes THIS iPHONE's hardware panel: its buttons, encoders, MASTER and keys play the phone's FIZZ as PLAY's touches do, and FIZZ's screen and LEDs are drawn on the unit's LCD and LEDs. The chip turns into RemoteFM1's linked chip, FM-1 panel with the green dot; the toast (ok, green edge) says so once. The panel stays attached on every tab and while PLAY is closed; the chip (or the picker's row, then reading PANEL with ×) lets it go, and pulling the cable does too. The sound stays on the phone: PLAY's sheet keeps This iPhone as the source and greys FM-1 while the unit is a panel. Over Bluetooth: USB only for now (RemoteFM1's screen needs it).",
    html: () => cmpGrid([
      [who(false, "Sound source FM-1 (RemoteFM1 · USB)"), rphone("rfm1-p-fm1-sheet")], [who(false, "FM-1 linked"), rphone("rfm1-p-fm1-full")],
      [who(true, "the picker: USE AS PANEL"), cphoneOver(cpFull(), pickerPanel(), "Tangerine", true)], [who(true, "the panel attached"), cphone(cpFullPanel())]], 2) },
);

// ---------------------------------------------------------------- the page
const out = document.getElementById("out");
const inits = [];
if (SHOT) {
  document.body.className = "shot";
  const s = SCREENS.find((x) => x.id === SHOT) || SCREENS[0];
  const el = $h(`<div>${s.html()}</div>`); out.appendChild(el); if (s.init) inits.push([s, el]);
} else {
  document.body.className = "sheet";
  out.appendChild($h(`<div class="sheettitle">FIZZ for iPhone and iPad: the companion app (mock-up)</div>`));
  out.appendChild($h(`<div class="sheetsub">The web Manager's tabs over USB (Camera / USB adapter) or Bluetooth MIDI. Captions describe the motion; they are not on screen.</div>`));
  const g = $h(`<div class="sgridp"></div>`); out.appendChild(g);
  SCREENS.forEach((s, i) => {
    const el = $h(`<div class="cell ${s.cmp8 || s.cmp6 ? "full" : s.ipad || s.cmpipad ? "wide" : s.land || s.cmpland ? "land" : s.pair || s.cmp || s.cmp4 ? "pr" : ""}"><div class="zf">${s.html()}</div><div class="ct"><span>${String(i + 1).padStart(2, "0")}</span>${s.id} · ${s.title}</div><p class="cap">${s.cap}</p></div>`);
    g.appendChild(el); if (s.init) inits.push([s, el]);
  });
}
inits.forEach(([s, el]) => s.init(el));
// still: every animation stopped at a chosen moment (a fraction of its loop), one-shots finished; SMIL at 0.6 s
const POSTER = { knturn: 0.5, beat: 0.05, kpulse: 0.5,swR: 0.5, swL: 0.5, slideK: 0.3, slideF: 0.3, burst: 0.5, rip: 0.35, fing: 0.5, trail: 0.5, tpop: 0.12, tbub: 0.16, lookp: 0.8, hintring: 0.62, drop: 0.55, flick: 0.1, run: 0.42, lv: 0.6, breathe: 0.5, curglow: 0.5, ppulse: 0.5, plugblink: 0, ckpop: 0.2, tgtfly: 0.4, plugA: 0.3, plugB: 0.3, dragL: 0.62, flyup: 0.1, ndot: 0.15, utap: 0.3, toastin: 0.45 };
function freeze() {
  document.getAnimations().forEach((a) => {
    const t = a.effect.getTiming();
    if (t.iterations === Infinity) { a.currentTime = (POSTER[a.animationName] ?? 0.5) * t.duration; a.pause(); } else a.finish();
  });
  document.querySelectorAll("svg").forEach((s) => { if (s.pauseAnimations && !s.ownerSVGElement) { s.pauseAnimations(); s.setCurrentTime(0.6); } });
}
if (STILL) document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(freeze)));
</script>
</body>
