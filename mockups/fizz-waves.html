<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIZZ waves</title>
<!-- FIZZ's logo screen, a mock-up (2026-10-19), the owner's direction: "different colored waves of lines that are
     oscillating with sort of static and harmonics that combine to form FIZZ, no gradient fills or anything, all line
     work". Stacked horizontal waveforms, one colour each; harmonics and static; they lock into the word (raised,
     clean and bright inside the letters) and dissolve again. Line work only: every mark is a 1 px stroke.
     One 240 x 240 canvas (the FM-1's panel), a 6 s loop.   ?t=SECONDS: one still (for the GIF)   no t: live at 2x -->
<style>
html, body { margin: 0; background: #000; }
body.live { display: grid; place-items: center; min-height: 100vh; }
canvas { display: block; image-rendering: pixelated; }
body.live canvas { width: 480px; height: 480px; }
</style>
</head>
<body>
<canvas id="c" width="240" height="240"></canvas>
<script src="font_it.js"></script>
<script>
const W = 240, H = 240, LOOP = 6.0, TAU = Math.PI * 2;
const PAL = [[40, 225, 255], [255, 40, 160], [255, 150, 30], [140, 90, 255], [255, 60, 60], [60, 255, 160]];
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const cv = document.getElementById('c'), c = cv.getContext('2d');

/* the word's mask, softened a little so the lines climb onto the letters rather than jump */
let MASK;
function buildMask() {
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const g = m.getContext('2d');
  g.font = '900 78px IT'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '1px';
  g.fillStyle = '#fff'; g.fillText('FIZZ', W / 2, H / 2 + 4);
  const d = g.getImageData(0, 0, W, H).data, a = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) a[i] = d[i * 4 + 3] / 255;
  MASK = new Float32Array(W * H);                        /* a small box blur, horizontal then vertical */
  const tmp = new Float32Array(W * H), R = 2;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let s = 0, n = 0; for (let k = -R; k <= R; k++) { const xx = x + k; if (xx >= 0 && xx < W) { s += a[y * W + xx]; n++; } }
    tmp[y * W + x] = s / n; }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let s = 0, n = 0; for (let k = -R; k <= R; k++) { const yy = y + k; if (yy >= 0 && yy < H) { s += tmp[yy * W + x]; n++; } }
    MASK[y * W + x] = s / n; }
}
const mask = (x, y) => { x = x | 0; y = y | 0; return x < 0 || y < 0 || x >= W || y >= H ? 0 : MASK[y * W + x]; };

/* the lock: 0 = static, 1 = the word (eases in 1.2 .. 2.6 s, holds, dissolves 4.4 .. 5.6 s) */
function lockAt(t) { return ease((t - 1.2) / 1.4) * (1 - ease((t - 4.4) / 1.2)); }

function frame(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const L = lockAt(t), frameNo = Math.floor(t * 30);
  const glitch = (t > 3.1 && t < 3.22) || (t > 3.9 && t < 3.97);   /* two little static bursts in the hold */
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const N = 40, top = 22, gap = (H - 2 * top) / (N - 1);
  for (let i = 0; i < N; i++) {
    const y0 = top + i * gap, col = PAL[i % PAL.length];
    const ph = hash(i * 3.7) * TAU, f1 = 0.035 + 0.02 * hash(i * 1.3), f2 = f1 * (2 + (i % 3)), f3 = f1 * 5.0;
    /* the static: strong while unlocked, almost gone while locked, back in the glitches */
    const stat = (1 - L) * 5.0 + (glitch ? 3.5 : 0) + 0.25;
    const harm = (1 - L) * 4.0 + 1.1;                       /* harmonics' amplitude */
    let prevX = 0, prevY = 0, prevIn = 0;
    for (let x = 0; x <= W; x += 2) {
      const m = mask(x, y0) * L;                          /* how much of the word this point is in */
      const wave = Math.sin(x * f1 + t * 3.1 + ph) * harm
                 + Math.sin(x * f2 - t * 4.7 + ph * 2) * harm * 0.5
                 + Math.sin(x * f3 + t * 9.0 + ph * 3) * harm * 0.22;
      const nz = (hash(x * 0.37 + i * 91.7 + frameNo * 13.1) - 0.5) * 2 * stat;
      const quiet = 1 - 0.7 * m;                         /* inside the letters the line calms */
      const y = y0 - m * 8 + (wave + nz) * quiet;         /* and rises onto them */
      if (x > 0) {
        const inside = (m + prevIn) * 0.5;
        const a = 0.5 + 0.5 * inside;                   /* brighter where it draws the word */
        const lc = inside > 0.5 ? [Math.min(255, col[0] + 90), Math.min(255, col[1] + 90), Math.min(255, col[2] + 90)] : col;
        c.strokeStyle = `rgba(${lc[0]},${lc[1]},${lc[2]},${a})`;
        c.lineWidth = 1;
        c.beginPath(); c.moveTo(prevX, prevY); c.lineTo(x, y); c.stroke();
      }
      prevX = x; prevY = y; prevIn = m;
    }
  }
}

(async () => {
  const ff = new FontFace('IT', `url(data:font/woff;base64,${FONT_B64})`, { weight: '100 900' });
  await ff.load(); document.fonts.add(ff);
  buildMask();
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { frame(+q.get('t')); document.body.dataset.ready = '1'; return; }
  document.body.className = 'live';
  const t0 = performance.now();
  const loop = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
})();
</script>
</body>
</html>
