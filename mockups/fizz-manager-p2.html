<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only
     FIZZ's web manager, Phase 2 mock-up (docs/MANAGER-P2-PLAN.md): the sound editor, export, projects and patterns,
     and the project library kept in the browser. Static: nothing connects. The
     names and values are invented.
     ?shot=N  one screen (render_png.py: p2-N)   ?sheet=1  every screen at half size   no query: all, one under another -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIZZ Manager P2 mock-up</title>
<style>
@font-face { font-family: "Inter Tight"; src: url("../site/fonts/InterTight-VF-latin.woff") format("woff"); font-weight: 100 900; }
:root {
  --bg: #000; --panel: #0b0b0e; --raised: #131318; --line: #22222a; --text: #ECECEF; --body: #C9C9D1; --muted: #8D8D96;
  --cyan: #28E1FF; --blue: #3F7DFF; --green: #1FD47E; --cream: #F1F0EA; --orange: #FF6A2C; --pink: #FF3CA0;
  --yellow: #FFD23F; --violet: #9664FF; --magenta: #F03CFF; --champagne: #F3D9A4; --red: #FF6464; --rose: #FF8FC8;
  /* the knobs' colours (core/ui/ui.h UI_K1..UI_K4, UI_KALG); the operators C A B1 B2 take them in order */
  --k1: #3F7DFF; --k2: #1FD47E; --k3: #F1F0EA; --k4: #FF6A2C; --kalg: #FF8FC8;
}
* { box-sizing: border-box; }
body { margin: 0; background: #050506; color: var(--body); font: 500 15px/1.4 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.all .screen { margin: 0 auto 40px; }
.screen { width: 1280px; height: 800px; background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column; }
b { color: var(--text); }
.top { height: 64px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.bub { width: 32px; height: 32px; fill: none; stroke-width: 2.4; }
.bub circle:nth-child(1) { stroke: var(--cyan); } .bub circle:nth-child(2) { stroke: var(--pink); } .bub circle:nth-child(3) { stroke: var(--yellow); }
.word { font-size: 26px; font-weight: 800; letter-spacing: .06em; background: linear-gradient(90deg, #28E1FF, #3F7DFF 30%, #F03CFF 62%, #FF6A2C 85%, #FFD23F); -webkit-background-clip: text; background-clip: text; color: transparent; }
.crumb { color: var(--text); font-weight: 600; font-size: 17px; }
.tabs { display: flex; gap: 8px; margin-left: 20px; }
.tab { height: 40px; padding: 0 16px; border-radius: 20px; display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 13px; letter-spacing: .08em; color: var(--muted); border: 1.5px solid var(--line); }
.tab i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.tab.on { color: #000; background: var(--c); border-color: var(--c); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); }
.tab.on i { background: #000; }
.unit { margin-left: auto; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; border: 1.5px solid var(--green); color: var(--text); font-weight: 700; font-size: 14px; white-space: nowrap; }
.unit .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.unit small { color: var(--muted); font-weight: 600; font-size: 13px; }
.body { flex: 1; display: flex; gap: 20px; padding: 22px 24px; min-height: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; position: relative; }
.h { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
.h .n { color: var(--text); letter-spacing: 0; font-size: 15px; }
.big { font-size: 44px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: -.01em; }
.btn { height: 52px; padding: 0 26px; border-radius: 26px; font: 800 16px "Inter Tight"; letter-spacing: .08em; border: 0; color: #000; background: var(--c, var(--cyan)); display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 0 22px color-mix(in srgb, var(--c, var(--cyan)) 40%, transparent); white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); box-shadow: none; }
.btn.small { height: 38px; padding: 0 16px; font-size: 13px; border-radius: 19px; }
.row { display: flex; gap: 10px; align-items: center; }
.kv { font-size: 13px; font-weight: 600; color: var(--muted); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: .05em; color: #000; }
.t-BASS { background: var(--blue); color: #fff; } .t-KEYS { background: var(--cream); } .t-PLUCK { background: var(--yellow); }
.t-PAD { background: var(--violet); color: #fff; } .t-LEAD { background: var(--green); } .t-DRUMS { background: var(--orange); } .t-FX { background: var(--pink); color: #fff; }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; }
.seg span { height: 40px; padding: 0 16px; display: flex; align-items: center; font-weight: 800; font-size: 13px; letter-spacing: .07em; color: var(--muted); white-space: nowrap; }
.seg span.on { background: var(--c); color: #000; }

/* the editor */
.grp { display: flex; flex-direction: column; gap: 8px; width: 156px; flex: none; }
.gk { height: 54px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--raised); display: flex; align-items: center; gap: 12px; padding: 0 14px; font-weight: 800; font-size: 14px; letter-spacing: .07em; color: var(--muted); }
.gk svg { flex: none; }
.gk.on { border-color: var(--c); color: var(--text); background: color-mix(in srgb, var(--c) 14%, var(--raised)); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 30%, transparent); }
.aud { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 20px; background: color-mix(in srgb, var(--pink) 16%, transparent); border: 1.5px solid var(--pink); color: var(--text); font-weight: 800; font-size: 13px; letter-spacing: .06em; white-space: nowrap; }
.aud .live { width: 9px; height: 9px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 10px var(--pink); }
.op { border-radius: 16px; background: var(--raised); border: 2px solid var(--c); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.op .nm { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--c); }
.op .v { font-size: 40px; font-weight: 800; color: var(--text); line-height: 1; }
.op .v small { font-size: 18px; color: var(--muted); font-weight: 700; }
.lev { height: 10px; border-radius: 5px; background: #1d1d23; overflow: hidden; }
.lev span { display: block; height: 100%; background: var(--c); border-radius: 5px; }
.dial { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dial .lb { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
.dial .vv { font-size: 22px; font-weight: 800; color: var(--text); }
.drag { position: absolute; border-radius: 50%; border: 3px solid var(--yellow); box-shadow: 0 0 18px var(--yellow); }

/* export */
.fmt { border-radius: 18px; border: 2px solid var(--line); background: var(--raised); padding: 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.fmt.on { border-color: var(--c); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 30%, transparent); background: color-mix(in srgb, var(--c) 8%, var(--raised)); }
.fmt .ext { font-size: 13px; font-weight: 800; color: var(--c); letter-spacing: .06em; }
.fmt .t { font-size: 26px; font-weight: 800; color: var(--text); }
.fid { display: flex; gap: 3px; }
.fid i { flex: 1; height: 14px; border-radius: 3px; background: #24242b; }
.lost { display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 16px; border-radius: 12px; background: var(--raised); border: 1.5px solid var(--line); margin-bottom: 8px; }
.lost .what { color: var(--text); font-weight: 800; font-size: 16px; width: 200px; }
.lost .how { font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 8px; color: #000; background: var(--c); }
.lost .val { color: var(--muted); font-weight: 700; font-size: 14px; margin-left: auto; }

/* projects */
.slot { height: 72px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--raised); display: flex; align-items: center; gap: 14px; padding: 0 16px; position: relative; }
.slot .no { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #000; background: var(--green); flex: none; }
.slot .pn { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: .03em; }
.slot .meta { font-size: 13px; font-weight: 700; color: var(--muted); }
.slot.empty { border-style: dashed; background: transparent; }
.slot.empty .no { background: #24242b; color: var(--muted); }
.slot.cur { border-color: var(--green); box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 30%, transparent), 0 0 20px color-mix(in srgb, var(--green) 25%, transparent); }
.slot.target { border: 2px solid var(--yellow); background: color-mix(in srgb, var(--yellow) 10%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--yellow) 40%, transparent); }
.mini { display: grid; grid-template-columns: repeat(16, 4px); gap: 2px; margin-left: auto; }
.mini i { width: 4px; height: 4px; border-radius: 1px; background: #2a2a31; }
.bp { border-radius: 16px; background: var(--raised); border: 1.5px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.bp .pn { font-size: 19px; font-weight: 800; color: var(--text); }
.bp .meta { font-size: 13px; font-weight: 700; color: var(--muted); }
.bp .snd { display: flex; gap: 4px; flex-wrap: wrap; }
.bp .snd i { width: 12px; height: 12px; border-radius: 3px; }
.ghost-drag { position: absolute; transform: rotate(-3deg); box-shadow: 0 18px 40px rgba(0,0,0,.6), 0 0 0 2px var(--yellow); border-color: var(--yellow) !important; z-index: 4; }
.stored { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 6px; color: #000; background: var(--champagne); }

/* patterns */
.pgrid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 7px; }
.pt { border-radius: 10px; background: #101014; border: 1.5px solid #1c1c22; padding: 6px 6px 7px; display: flex; flex-direction: column; gap: 3px; position: relative; }
.pt .no { font-size: 11px; font-weight: 800; color: #6a6a74; margin-bottom: 2px; }
.pt .tr { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; height: 4px; }
.pt .tr i { border-radius: 1px; background: #1f1f25; }
.pt.used { border-color: #2c2c34; background: #131318; }
.pt.cur { border-color: var(--cyan); box-shadow: 0 0 12px color-mix(in srgb, var(--cyan) 40%, transparent); }
.pt.sel { border: 2px solid var(--yellow); box-shadow: 0 0 16px color-mix(in srgb, var(--yellow) 45%, transparent); }
.pt.tgt { border: 2px dashed var(--yellow); background: color-mix(in srgb, var(--yellow) 10%, #101014); }
.bank { font-size: 15px; font-weight: 800; color: var(--text); width: 22px; display: grid; place-items: center; }

/* the FM-1 */
.lcd { width: 240px; height: 240px; background: #000; border-radius: 6px; position: relative; overflow: hidden; box-shadow: 0 0 0 10px #1a1a1f, 0 0 0 11px #2a2a31; }
.fm1 { width: 320px; border-radius: 26px; background: #1c1c21; padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.fm1 .keys { display: flex; gap: 8px; }
.fm1 .key { width: 52px; height: 34px; border-radius: 7px; background: #2b2b31; border: 1.5px solid #383840; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #6c6c75; }
.fm1 .key.lit { background: var(--green); border-color: var(--green); color: #000; box-shadow: 0 0 18px var(--green); }
.fm1 .key.dim { background: color-mix(in srgb, var(--red) 25%, #2b2b31); border-color: color-mix(in srgb, var(--red) 50%, #383840); color: var(--red); }
.scrim { position: absolute; inset: 64px 0 0 0; background: rgba(0,0,0,.72); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; gap: 40px; z-index: 5; }
.modal { width: 640px; background: var(--panel); border: 1.5px solid var(--yellow); border-radius: 22px; padding: 24px; box-shadow: 0 0 40px color-mix(in srgb, var(--yellow) 25%, transparent); }
.cf { display: grid; grid-template-columns: 26px 1fr 210px; gap: 12px; align-items: center; height: 52px; padding: 0 14px; border-radius: 12px; background: var(--raised); border: 1.5px solid var(--line); margin-bottom: 8px; }
.cf .nm { color: var(--text); font-weight: 800; font-size: 16px; }
.st { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }

/* the player as the big screen */
.pkey { height: 40px; border-radius: 10px; background: #1b1b21; border: 1.5px solid #2c2c34; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .06em; }
.pkey.lit { background: color-mix(in srgb, var(--c) 30%, #1b1b21); border-color: var(--c); color: var(--text); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 45%, transparent); }
.knob { width: 62px; height: 62px; border-radius: 50%; background: #18181d; border: 2px solid #2c2c34; position: relative; }
.knob::after { content: ""; position: absolute; left: 28px; top: 6px; width: 4px; height: 18px; border-radius: 2px; background: var(--c); transform-origin: 2px 23px; transform: rotate(var(--a, 0deg)); }
.knob.ring { box-shadow: 0 0 0 3px var(--c); }

/* the sheet */
body.sheet { padding: 24px; background: #101012; }
.sheetgrid { display: grid; grid-template-columns: repeat(3, 640px); gap: 26px 22px; }
.sheetgrid .cell { width: 640px; }
.sheetgrid .frame { width: 640px; height: 400px; overflow: hidden; border-radius: 8px; }
.sheetgrid .frame .screen { transform: scale(.5); transform-origin: 0 0; }
.sheetgrid .cap { color: #c8c8cf; font: 700 15px "Inter Tight", sans-serif; margin: 8px 0 0; }
.sheettitle { font: 800 24px "Inter Tight", sans-serif; margin: 0 0 18px; color: #eee; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const TAGC = { BASS: "--blue", KEYS: "--cream", PLUCK: "--yellow", PAD: "--violet", LEAD: "--green", DRUMS: "--orange", FX: "--pink" };
const tag = (t) => `<span class="tag t-${t}">${t}</span>`;
const TABS = [["BACKUP", "--yellow"], ["LIBRARY", "--cream"], ["EDIT", "--pink"], ["POOL", "--green"], ["PROJECTS", "--cyan"], ["IMPORT", "--violet"]];
const topBar = (on, unit = `FM-1 <small>FIZZ 0.13.0 · 6 tracks</small>`) => `<div class="top"><svg class="bub" viewBox="0 0 32 32"><circle cx="11" cy="20" r="7"/><circle cx="22" cy="10" r="5"/><circle cx="23" cy="24" r="3"/></svg><span class="word">FIZZ</span><span class="crumb">Manager</span>
  <div class="tabs">${TABS.map(([t, c]) => `<span class="tab ${t === on ? "on" : ""}" style="--c:var(${c})"><i></i>${t}</span>`).join("")}</div>
  <span class="unit"><span class="dot"></span>${unit}</span></div>`;

// the editor's group keys (the device's B1..B8 groups: TRIG/KEYS, OPERATORS, OP ENVELOPES, FILTER, AMP, LFO 1..3), each an icon
const GROUPS = [["OPERATORS", "--k1", "M4 18a5 5 0 1 0 10 0 5 5 0 1 0-10 0M15 7a4 4 0 1 0 8 0 4 4 0 1 0-8 0M12 14l5-4"],
  ["OP ENV", "--k2", "M2 20 L7 4 L13 12 L22 12 L22 20"], ["FILTER", "--k4", "M2 8 H12 Q16 8 18 4 Q19 14 24 20"],
  ["AMP", "--k3", "M2 20 L5 5 L10 10 L18 10 L23 20"], ["LFO", "--cyan", "M2 12 Q6 2 10 12 T18 12 T26 12"],
  ["MOD", "--kalg", "M4 6 h6 M4 12 h6 M4 18 h6 M14 6 L22 18 M14 18 L22 6"], ["PLAY", "--yellow", "M6 4 L20 12 L6 20 Z"]];
const groupCol = (on) => `<div class="grp">${GROUPS.map(([n, c, d]) => `<div class="gk ${n === on ? "on" : ""}" style="--c:var(${c})"><svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="var(${c})" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${n}</div>`).join("")}</div>`;
const edHead = (name, slot, t) => `<div class="row" style="gap:16px">
    <div><div class="h" style="margin:0">${slot}</div><div class="big" style="font-size:38px">${name}</div></div>${tag(t)}
    <span class="aud" style="margin-left:auto"><span class="live"></span>TRACK 3 · LIVE</span>
    <button class="btn small ghost">↺ REVERT</button><button class="btn small" style="--c:var(--pink);color:#fff">SAVE</button><button class="btn small ghost">SAVE AS NEW</button></div>`;

const SCREENS = [];
const CAPS = [];

// 1. EDIT: OPERATORS. The algorithm drawn big, each operator its own card in its knob's colour
CAPS.push("1 EDIT · OPERATORS: the algorithm big, a card an operator (ratio, level), TRACK 3 plays it live");
SCREENS.push(() => {
  // operators: C (k1) A (k2) B1 (k3) B2 (k4); algorithm 5: B2 -> B1 -> A, A -> C; C and A? carriers C only, B2 feedback
  const P = { C: [330, 330], A: [330, 210], B1: [470, 210], B2: [470, 90] };
  const col = { C: "var(--k1)", A: "var(--k2)", B1: "var(--k3)", B2: "var(--k4)" };
  const ar = (a, b) => { const [x1, y1] = P[a], [x2, y2] = P[b]; const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l;
    const sx = x1 + ux * 40, sy = y1 + uy * 40, ex = x2 - ux * 44, ey = y2 - uy * 44;
    return `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="#8D8D96" stroke-width="4" stroke-linecap="round"/><path d="M${ex} ${ey} l${-ux * 14 - uy * 9} ${-uy * 14 + ux * 9} l${uy * 18} ${-ux * 18} z" fill="#8D8D96"/><circle cx="${sx + (ex - sx) * .55}" cy="${sy + (ey - sy) * .55}" r="5" fill="var(--cream)"/>`; };
  const ops = Object.entries(P).map(([k, [x, y]]) => `<circle cx="${x}" cy="${y}" r="38" fill="color-mix(in srgb, ${col[k]} 22%, #0b0b0e)" stroke="${col[k]}" stroke-width="5"/><text x="${x}" y="${y + 10}" text-anchor="middle" font-size="28" font-weight="800" fill="${col[k]}">${k}</text>`).join("");
  const svg = `<svg width="600" height="430" viewBox="0 0 600 430">
    <line x1="120" y1="400" x2="520" y2="400" stroke="#3a3a44" stroke-width="3"/>
    <line x1="330" y1="368" x2="330" y2="400" stroke="var(--cream)" stroke-width="6"/>
    <path d="M520 388h12v24h-12zM532 388l16-14v52l-16-14" fill="none" stroke="#8D8D96" stroke-width="3"/>
    <path d="M556 384a22 22 0 0 1 0 32" fill="none" stroke="var(--cream)" stroke-width="3" opacity=".7"/>
    ${ar("B2", "B1")}${ar("B1", "A")}${ar("A", "C")}
    <path d="M500 64 a30 30 0 1 1 8 40" fill="none" stroke="var(--k4)" stroke-width="4" stroke-dasharray="8 6"/>
    ${ops}
    <text x="40" y="70" font-size="18" font-weight="800" fill="var(--kalg)" letter-spacing="2">ALGO</text><text x="40" y="150" font-size="100" font-weight="800" fill="var(--kalg)">5</text>
  </svg>`;
  const op = (n, c, ratio, frac, lev, extra = "") => `<div class="op" style="--c:var(${c})"><div class="nm">${n}</div><div class="v">${ratio}<small>${frac}</small></div><div class="lev"><span style="width:${lev}%"></span></div>${extra}</div>`;
  return `<div class="screen">${topBar("EDIT")}<div class="body">
    ${groupCol("OPERATORS")}
    <div class="card" style="flex:1;display:flex;flex-direction:column;gap:14px">
      ${edHead("ROUND BASS", "MY PRESETS 8", "BASS")}
      <div class="row" style="align-items:flex-start;gap:18px;flex:1">
        <div style="position:relative">${svg}<span class="drag" style="left:428px;top:168px;width:84px;height:84px"></span></div>
        <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px">
          ${op("C", "--k1", "1", ".00", 100)}${op("A", "--k2", "2", ".00", 72)}
          ${op("B1", "--k3", "3", ".50", 58)}${op("B2", "--k4", "0", ".50", 40)}
        </div>
      </div>
      <div class="row" style="gap:34px;justify-content:center">
        ${[["HARM", "+0.40", "--k1"], ["DTUN", "0.12", "--k2"], ["FDBK", "48", "--k4"], ["MIX X·Y", "−20", "--k3"], ["DRIVE", "22", "--orange"]].map(([l, v, c]) =>
          `<div class="dial"><svg width="70" height="44" viewBox="0 0 70 44"><path d="M8 40 A28 28 0 0 1 62 40" fill="none" stroke="#24242b" stroke-width="7" stroke-linecap="round"/><path d="M8 40 A28 28 0 0 1 ${l === "FDBK" ? 46 : l === "DRIVE" ? 22 : 40} ${l === "FDBK" ? 16 : l === "DRIVE" ? 18 : 12}" fill="none" stroke="var(${c})" stroke-width="7" stroke-linecap="round"/></svg><span class="vv">${v}</span><span class="lb">${l}</span></div>`).join("")}
      </div>
    </div></div></div>`;
});

// 2. EDIT: FILTER + AMP. The filter's curve big; the amp envelope a shape with handles
CAPS.push("2 EDIT · FILTER + AMP: the curve and the envelope are the controls; drag a handle, TRACK 3 follows");
SCREENS.push(() => {
  const curve = `<svg width="560" height="300" viewBox="0 0 560 300">
    ${[1, 2, 3, 4, 5].map((i) => `<line x1="${i * 100}" y1="20" x2="${i * 100}" y2="280" stroke="#18181d" stroke-width="2"/>`).join("")}

function lcdLoad(cv) {
  const g = cv.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, 240, 240);
  // the eight slots as a 4 x 2 grid of small cassettes, slot 7 lit yellow with the cassette dropping in
  for (let i = 0; i < 8; i++) {
    const x = 24 + (i % 4) * 50, y = 120 + Math.floor(i / 4) * 40, on = [0, 1, 2, 3, 5].includes(i);
    g.lineWidth = 3; g.strokeStyle = i === 6 ? "#FFD23F" : on ? "#1FD47E" : "#34343d"; g.fillStyle = on ? "rgba(31,212,126,.25)" : "#000";
    g.beginPath(); g.roundRect(x, y, 42, 30, 6); g.fill(); g.stroke();
  }
  g.lineWidth = 5; g.strokeStyle = "#FFD23F"; g.lineJoin = "round";
  g.beginPath(); g.roundRect(70, 22, 100, 62, 10); g.stroke();
  g.lineWidth = 4; [100, 140].forEach((x) => { g.beginPath(); g.arc(x, 50, 11, 0, 7); g.stroke(); });
  g.beginPath(); g.moveTo(120, 90); g.lineTo(120, 108); g.moveTo(110, 98); g.lineTo(120, 110); g.lineTo(130, 98); g.stroke();
  g.fillStyle = "#ECECEF"; g.font = "800 26px 'Inter Tight'"; g.textAlign = "center"; g.fillText("WINTER LP", 120, 222);
}

} else {
  (shot ? [SCREENS[shot - 1]] : SCREENS).forEach((f) => out.appendChild($(f())));
  if (!shot) document.body.className = "all";
}
document.fonts.load("800 30px 'Inter Tight'").finally(paint);
</script>
